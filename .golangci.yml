version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: strict
    paths:
      - ^internal/database/sqlc/
