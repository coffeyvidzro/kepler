name: Domain Aggregate Bootstrap

on:
  push:
    branches:
      - agent/create-domains-aggregate
    paths:
      - ".github/domain-aggregate-bootstrap/**"
      - ".github/workflows/domain-aggregate-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: domain-aggregate-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/create-domains-aggregate
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Apply authored domain aggregate
        run: |
          cat .github/domain-aggregate-bootstrap/* | base64 --decode | tar -xz
          python .tmp/domain_cutover.py
          gofmt -w \
            internal/modules/domain \
            internal/modules/email/repository.go \
            internal/delivery/email/outbound/repository.go \
            internal/backoffice/domains/repository.go
          rm -rf .tmp .github/domain-aggregate-bootstrap
          rm -f .github/workflows/domain-aggregate-bootstrap.yml

      - name: Commit authored changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create dedicated domain aggregate"
          git push origin HEAD:agent/create-domains-aggregate

      - name: Regenerate sqlc
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Refresh migration checksums
        run: |
          docker run --rm \
            -v "$PWD/migrations:/migrations" \
            arigaio/atlas:0.35.0 \
            migrate hash --dir file:///migrations

      - name: Commit generated artifacts
        run: |
          gofmt -w internal/database/sqlc
          git add internal/database/sqlc migrations/atlas.sum
          git commit -m "Regenerate domain database artifacts"
          git push origin HEAD:agent/create-domains-aggregate
