name: Docker CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker.yml"
      - ".env.example"
      - "Dockerfile"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "**/*.go"
  pull_request:
    paths:
      - ".github/workflows/docker.yml"
      - ".env.example"
      - "Dockerfile"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "**/*.go"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fold-email-feedback-migration:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/messaging-unified-feedback-processing' && github.actor != 'github-actions[bot]'
    name: Fold email feedback migration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/messaging-unified-feedback-processing
          fetch-depth: 0

      - name: Fold aggregate statuses into migration 012
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('migrations/012_create_email_messages.sql')
          text = migration.read_text()
          old = (
              "        'delivered', 'delayed', 'bounced', 'complained', 'rejected',\n"
              "        'failed', 'canceled'\n"
          )
          new = (
              "        'delivered', 'partially_delivered', 'delayed', 'partially_failed',\n"
              "        'bounced', 'complained', 'rejected', 'failed', 'canceled'\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one email status constraint block, found {text.count(old)}')
          migration.write_text(text.replace(old, new, 1))

          extension = Path('migrations/026_extend_email_feedback_statuses.sql')
          if not extension.exists():
              raise SystemExit('migration 026 is missing before fold')
          extension.unlink()
          PY

      - name: Regenerate and validate Atlas checksums
        run: |
          docker run --rm -v "$PWD/migrations:/migrations" arigaio/atlas:1.3.0-alpine migrate hash --dir file:///migrations
          docker run --rm -v "$PWD/migrations:/migrations:ro" arigaio/atlas:1.3.0-alpine migrate validate --dir file:///migrations

      - name: Verify and commit folded migration
        run: |
          test ! -e migrations/026_extend_email_feedback_statuses.sql
          grep -q "'partially_delivered'" migrations/012_create_email_messages.sql
          grep -q "'partially_failed'" migrations/012_create_email_messages.sql
          ! grep -q "026_extend_email_feedback_statuses.sql" migrations/atlas.sum
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/012_create_email_messages.sql migrations/026_extend_email_feedback_statuses.sql migrations/atlas.sum
          test -n "$(git status --porcelain)"
          git commit -m "chore: fold email feedback statuses into base migration"
          git push origin HEAD:feat/messaging-unified-feedback-processing

  docker:
    name: Container and deployment gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet

      - name: Validate migration checksums and SQL
        run: |
          docker run --rm \
            -v "${PWD}/migrations:/migrations:ro" \
            arigaio/atlas:1.3.0-alpine \
            migrate validate --dir file:///migrations

      - name: Build production image
        run: docker build --tag kepler-ci:${{ github.sha }} .
