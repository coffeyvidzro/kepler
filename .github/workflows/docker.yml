name: Docker CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker.yml"
      - ".env.example"
      - "Dockerfile"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "**/*.go"
  pull_request:
    paths:
      - ".github/workflows/docker.yml"
      - ".env.example"
      - "Dockerfile"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "**/*.go"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Container and deployment gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet

      - name: Generate migration checksum
        run: |
          docker run --rm \
            -v "${PWD}/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Upload generated migration checksum
        uses: actions/upload-artifact@v4
        with:
          name: atlas-checksum-no-seeds
          path: migrations/atlas.sum

      - name: Validate migration checksums and SQL
        run: |
          docker run --rm \
            -v "${PWD}/migrations:/migrations:ro" \
            arigaio/atlas:1.3.0-alpine \
            migrate validate --dir file:///migrations

      - name: Build production image
        run: docker build --tag kepler-ci:${{ github.sha }} .
