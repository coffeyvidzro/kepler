name: Server CI

on:
  push:
    branches:
      - main
      - agent/templates-topics-compatibility
    paths:
      - ".github/workflows/server.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "sqlc.yaml"
      - "scripts/apply_templates_topics_compat.py"
      - "**/*.go"
      - "**/*.sql"
  pull_request:
    paths:
      - ".github/workflows/server.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "sqlc.yaml"
      - "scripts/apply_templates_topics_compat.py"
      - "**/*.go"
      - "**/*.sql"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/templates-topics-compatibility
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Apply compatibility changes
        run: python3 scripts/apply_templates_topics_compat.py

      - name: Format changed files
        run: gofmt -w internal/modules/messagetemplate internal/modules/topic internal/transport/http/messagetemplate internal/transport/http/topic

      - name: Test affected packages
        run: go test ./internal/modules/messagetemplate ./internal/modules/topic ./internal/transport/http/messagetemplate ./internal/transport/http/topic

      - name: Commit compatibility implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/modules/messagetemplate internal/modules/topic internal/transport/http/messagetemplate internal/transport/http/topic migrations/029_create_message_templates.sql
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Templates and Topics API compatibility"
          git push origin HEAD:agent/templates-topics-compatibility

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify sqlc generated code
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/database/sqlc

      - name: Install golangci-lint
        run: go install github.com/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Verify golangci-lint config
        run: golangci-lint config verify --config .golangci.yml

      - name: Run golangci-lint
        run: golangci-lint run --config .golangci.yml ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...
