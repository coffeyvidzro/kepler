name: Server CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/server.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "sqlc.yaml"
      - "**/*.go"
      - "**/*.sql"
  pull_request:
    paths:
      - ".github/workflows/server.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "sqlc.yaml"
      - "**/*.go"
      - "**/*.sql"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Regenerate sqlc code
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          if git diff --quiet -- internal/database/sqlc; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/database/sqlc
          git commit -m "Regenerate contact property sqlc"
          git push origin HEAD:agent/contact-property-compatibility

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Verify golangci-lint config
        run: golangci-lint config verify --config .golangci.yml

      - name: Run golangci-lint
        run: golangci-lint run --config .golangci.yml ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...
