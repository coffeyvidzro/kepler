name: Server CI

on:
  push:
    branches:
      - main
      - agent/templates-topics-compatibility
    paths:
      - ".github/workflows/server.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "sqlc.yaml"
      - "**/*.go"
      - "**/*.sql"
  pull_request:
    paths:
      - ".github/workflows/server.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "sqlc.yaml"
      - "**/*.go"
      - "**/*.sql"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/templates-topics-compatibility
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Apply compatibility changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Template models: alias is optional and API updates do not expose internal base versions.
          replace("internal/modules/messagetemplate/model.go", "\tAlias                 string     `json:\"alias\"`", "\tAlias                 *string    `json:\"alias\"`")
          replace("internal/modules/messagetemplate/model.go", "\tAlias     string     `json:\"alias\"`", "\tAlias     *string    `json:\"alias,omitempty\"`")
          replace("internal/modules/messagetemplate/model.go", "\tAlias         *string     `json:\"alias,omitempty\"`", "\tAlias         **string    `json:\"alias,omitempty\"`")
          replace("internal/modules/messagetemplate/model.go", "type DuplicateRequest struct {\n\tName  string `json:\"name\"`\n\tAlias string `json:\"alias\"`\n}", "type DuplicateRequest struct {\n\tName  string  `json:\"name,omitempty\"`\n\tAlias *string `json:\"alias,omitempty\"`\n}")

          # Existing migration has not run; align draft fields with the public API.
          replace("migrations/029_create_message_templates.sql", "    alias VARCHAR(100) NOT NULL,", "    alias VARCHAR(100),")
          replace("migrations/029_create_message_templates.sql", "    CONSTRAINT chk_message_template_versions_subject CHECK (length(btrim(subject)) > 0),\n", "")

          # Template service validation and duplicate defaults.
          p = Path("internal/modules/messagetemplate/service.go")
          text = p.read_text()
          start = text.index("func validateCreate(req CreateRequest)")
          end = text.index("func requireAccess(", start)
          replacement = r'''func validateCreate(req CreateRequest) (CreateRequest, error) {
	req.Name = strings.TrimSpace(req.Name)
	req.Alias = normalizeOptional(req.Alias)
	req.Subject = strings.TrimSpace(req.Subject)
	if req.Name == "" || utf8.RuneCountInString(req.Name) > maxTemplateNameCharacters {
		return req, apperrors.NewBadRequest("Template name is required and must be at most 100 characters")
	}
	if err := validateAlias(req.Alias); err != nil {
		return req, err
	}
	if err := validateContent(req.Subject, req.HTML, req.FromEmail, req.ReplyTo, req.Variables); err != nil {
		return req, err
	}
	req.FromEmail = normalizeOptional(req.FromEmail)
	req.FromName = normalizeOptional(req.FromName)
	return req, nil
}

func validateUpdate(template Template, base Version, req *UpdateRequest) error {
	name, alias := template.Name, template.Alias
	if req.Name != nil {
		name = strings.TrimSpace(*req.Name)
		req.Name = &name
	}
	if req.Alias != nil {
		alias = normalizeOptional(*req.Alias)
		req.Alias = &alias
	}
	if name == "" || utf8.RuneCountInString(name) > maxTemplateNameCharacters {
		return apperrors.NewBadRequest("Template name is required and must be at most 100 characters")
	}
	if err := validateAlias(alias); err != nil {
		return err
	}
	subject, htmlBody, variables := base.Subject, base.HTML, base.Variables
	fromEmail, replyTo := base.FromEmail, base.ReplyToEmail
	if req.Subject != nil {
		subject = strings.TrimSpace(*req.Subject)
		req.Subject = &subject
	}
	if req.HTML != nil {
		htmlBody = *req.HTML
	}
	if req.Variables != nil {
		variables = *req.Variables
	}
	if req.FromEmail != nil {
		fromEmail = *req.FromEmail
	}
	if req.ReplyTo != nil {
		replyTo = *req.ReplyTo
	}
	return validateContent(subject, htmlBody, fromEmail, replyTo, variables)
}

func validateVersion(version Version) error {
	if strings.TrimSpace(version.Subject) == "" {
		return apperrors.NewBadRequest("Template subject is required before publishing")
	}
	return validateContent(version.Subject, version.HTML, version.FromEmail, version.ReplyToEmail, version.Variables)
}

func validateAlias(alias *string) error {
	if alias == nil {
		return nil
	}
	if len(*alias) > maxTemplateAliasCharacters || !aliasPattern.MatchString(*alias) {
		return apperrors.NewBadRequest("Template alias must use letters, numbers, underscores, or dashes and be at most 100 characters")
	}
	return nil
}

func validateContent(subject, htmlBody string, fromEmail, replyTo *string, variables []Variable) error {
	if utf8.RuneCountInString(subject) > maxTemplateSubjectChars {
		return apperrors.NewBadRequest("Template subject must be at most 255 characters")
	}
	if strings.TrimSpace(htmlBody) == "" {
		return apperrors.NewBadRequest("Template HTML is required")
	}
	if len(variables) > maxTemplateVariables {
		return apperrors.NewBadRequest("Template may define at most 50 variables")
	}
	definitions := map[string]struct{}{}
	for _, v := range variables {
		if !variableKeyPattern.MatchString(v.Key) {
			return apperrors.NewBadRequest("Template variable keys must start with a letter and use only letters, numbers, and underscores")
		}
		upper := strings.ToUpper(v.Key)
		if _, reserved := reservedVariables[upper]; reserved {
			return apperrors.NewBadRequest("Template variable key is reserved: " + v.Key)
		}
		if _, exists := definitions[v.Key]; exists {
			return apperrors.NewBadRequest("Template variable keys must be unique")
		}
		definitions[v.Key] = struct{}{}
		if v.Type != VariableTypeString && v.Type != VariableTypeNumber {
			return apperrors.NewBadRequest("Template variable type must be string or number")
		}
		if v.FallbackValue != nil {
			if _, err := renderVariableValue(v, v.FallbackValue); err != nil {
				return apperrors.NewBadRequest(err.Error())
			}
		}
	}
	for _, key := range referencedVariables(subject, htmlBody) {
		if _, exists := definitions[key]; !exists {
			return apperrors.NewBadRequest("Unknown template variable: " + key)
		}
	}
	if err := validateStoredEmail(fromEmail, "Template sender"); err != nil {
		return err
	}
	if replyTo != nil {
		values, err := decodeStoredReplyTo(replyTo)
		if err != nil {
			return apperrors.NewBadRequest("Template reply-to addresses are invalid")
		}
		for _, value := range values {
			address, parseErr := mail.ParseAddress(strings.TrimSpace(value))
			if parseErr != nil || address.Address == "" {
				return apperrors.NewBadRequest("Template reply-to addresses are invalid")
			}
		}
	}
	return nil
}

func validateStoredEmail(value *string, label string) error {
	if value == nil {
		return nil
	}
	parsed, err := mail.ParseAddress(strings.TrimSpace(*value))
	if err != nil || !strings.EqualFold(parsed.Address, strings.TrimSpace(*value)) {
		return apperrors.NewBadRequest(label + " must be a valid email address")
	}
	return nil
}

func normalizeOptional(value *string) *string {
	if value == nil {
		return nil
	}
	trimmed := strings.TrimSpace(*value)
	if trimmed == "" {
		return nil
	}
	return &trimmed
}
func normalizeList(req *ListRequest) {
	if req.Limit <= 0 || req.Limit > 100 {
		req.Limit = 50
	}
	if req.Offset < 0 {
		req.Offset = 0
	}
}
'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('"FIRST_NAME": {}, "LAST_NAME": {}, "EMAIL": {}, "UNSUBSCRIBE_URL": {},', '"FIRST_NAME": {}, "LAST_NAME": {}, "EMAIL": {}, "UNSUBSCRIBE_URL": {}, "RESEND_UNSUBSCRIBE_URL": {},')
          old = '''\tcreate := CreateRequest{Name: req.Name, Alias: req.Alias, FromEmail: version.FromEmail, FromName: version.FromName, ReplyTo: version.ReplyToEmail, Subject: version.Subject, HTML: version.HTML, Text: version.Text, Variables: version.Variables}
'''
          new = '''\tname := strings.TrimSpace(req.Name)
\tif name == "" {
\t\tname = source.Name + " Copy"
\t}
\tcreate := CreateRequest{Name: name, Alias: req.Alias, FromEmail: version.FromEmail, FromName: version.FromName, ReplyTo: version.ReplyToEmail, Subject: version.Subject, HTML: version.HTML, Text: version.Text, Variables: version.Variables}
'''
          if old not in text:
              raise SystemExit("duplicate create mapping not found")
          p.write_text(text.replace(old, new, 1))

          # Template API adapter pointer mapping.
          replace("internal/modules/messagetemplate/compatibility.go", "\tmapped.Alias = request.Alias\n", "\tif request.Alias != nil {\n\t\tmapped.Alias = &request.Alias\n\t}\n")

          # Cursor pagination for templates.
          p = Path("internal/modules/messagetemplate/repository.go")
          text = p.read_text().rstrip() + r'''

func (r *Repository) CursorExists(ctx context.Context, teamID, cursorID uuid.UUID) (bool, error) {
	var exists bool
	err := r.db.QueryRow(ctx, `SELECT EXISTS(SELECT 1 FROM message_templates WHERE id=$1 AND team_id=$2 AND deleted_at IS NULL)`, cursorID, teamID).Scan(&exists)
	return exists, err
}

func (r *Repository) ListPage(ctx context.Context, teamID uuid.UUID, limit int32, after, before *uuid.UUID) ([]Template, error) {
	query := `SELECT id,team_id,name,alias,current_version_id,published_version_id,published_at,created_at,updated_at
		FROM message_templates WHERE team_id=$1 AND deleted_at IS NULL`
	args := []any{teamID}
	if after != nil {
		query += ` AND (created_at,id) < (SELECT created_at,id FROM message_templates WHERE id=$2 AND team_id=$1 AND deleted_at IS NULL)`
		args = append(args, *after)
	}
	if before != nil {
		query += ` AND (created_at,id) > (SELECT created_at,id FROM message_templates WHERE id=$2 AND team_id=$1 AND deleted_at IS NULL)`
		args = append(args, *before)
	}
	if before != nil {
		query += ` ORDER BY created_at ASC,id ASC`
	} else {
		query += ` ORDER BY created_at DESC,id DESC`
	}
	args = append(args, limit)
	query += fmt.Sprintf(` LIMIT $%d`, len(args))
	rows, err := r.db.Query(ctx, query, args...)
	if err != nil {
		return nil, err
	}
	defer rows.Close()
	result := make([]Template, 0)
	for rows.Next() {
		var value Template
		if err := rows.Scan(&value.ID, &value.TeamID, &value.Name, &value.Alias, &value.CurrentVersionID, &value.PublishedVersionID, &value.PublishedAt, &value.CreatedAt, &value.UpdatedAt); err != nil {
			return nil, err
		}
		value.HasUnpublishedChanges = value.CurrentVersionID != nil && (value.PublishedVersionID == nil || *value.CurrentVersionID != *value.PublishedVersionID)
		result = append(result, value)
	}
	return result, rows.Err()
}
'''
          p.write_text(text)

          # Topics support visibility updates, private default, and cursor pages.
          replace("internal/modules/topic/model.go", "type UpdateRequest struct {\n\tName        *string  `json:\"name,omitempty\"`\n\tDescription **string `json:\"description,omitempty\"`\n}", "type UpdateRequest struct {\n\tName        *string  `json:\"name,omitempty\"`\n\tDescription **string `json:\"description,omitempty\"`\n\tVisibility  *string  `json:\"visibility,omitempty\"`\n}")
          replace("internal/modules/topic/service.go", "\tif req.Visibility == \"\" {\n\t\treq.Visibility = \"public\"\n\t}", "\tif req.Visibility == \"\" {\n\t\treq.Visibility = \"private\"\n\t}")
          replace("internal/modules/topic/service.go", "\tname := current.Name\n\tdescription := current.Description", "\tname := current.Name\n\tdescription := current.Description\n\tvisibility := current.Visibility")
