name: Server CI

on:
  push:
    branches:
      - fix/topics-sqlc-repository
    paths:
      - ".github/workflows/server.yml"
      - "internal/database/queries/topics.sql"
      - "internal/modules/topic/repository.go"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Regenerate topic sqlc
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/topics-sqlc-repository
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Generate sqlc
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Format repository
        run: gofmt -w internal/modules/topic/repository.go

      - name: Test topic packages
        run: go test ./internal/modules/topic ./internal/transport/http/topic

      - name: Commit generated code
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/database/sqlc/topics.sql.go internal/modules/topic/repository.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate topic sqlc"
          git push origin HEAD:fix/topics-sqlc-repository
