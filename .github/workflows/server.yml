          replace("internal/modules/topic/repository.go", "\t\tUPDATE topics SET name = $3, description = $4, updated_at = now()\n\t\tWHERE id = $1 AND team_id = $2", "\t\tUPDATE topics SET name = $3, description = $4, visibility = $5, updated_at = now()\n\t\tWHERE id = $1 AND team_id = $2")
          replace("internal/modules/topic/repository.go", "\t`, id, teamID, name, description).Scan", "\t`, id, teamID, name, description, visibility).Scan")
          p = Path("internal/modules/topic/repository.go")
          text = p.read_text().rstrip() + r'''

