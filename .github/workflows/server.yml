name: Server CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/server.yml"
      - ".golangci.yml"
      - "Dockerfile"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "sqlc.yaml"
      - "**/*.go"
      - "**/*.sql"
  pull_request:
    paths:
      - ".github/workflows/server.yml"
      - ".golangci.yml"
      - "Dockerfile"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "sqlc.yaml"
      - "**/*.go"
      - "**/*.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify sqlc generated code
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/database/sqlc

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Verify golangci-lint config
        run: golangci-lint config verify --config .golangci.yml

      - name: Run golangci-lint
        run: golangci-lint run --config .golangci.yml ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

  deployment:
    name: Deployment artifact gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_DOMAIN: api.example.test
      APP_ENV: test
      ARCJET_KEY: ci-arcjet-key
      ARGUS_HMAC_SECRET: ci-argus-secret
      AWS_FROM_EMAIL: no-reply@example.test
      BACKEND_URL: https://api.example.test
      COOKIE_DOMAIN: example.test
      CORS_ORIGINS: https://frontend.example.test
      ENCRYPTION_KEYS: ci-encryption-key
      FRONTEND_URL: https://frontend.example.test
      NATS_PASSWORD: ci-nats-password
      POSTGRES_PASSWORD: ci-postgres-password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose -f deploy/compose.yaml config >/dev/null

      - name: Validate migration checksums and SQL
        run: |
          docker run --rm \
            -v "${PWD}/migrations:/migrations:ro" \
            arigaio/atlas:1.3.0-alpine \
            migrate validate --dir file:///migrations

      - name: Build production image
        run: docker build --tag kepler-ci:${{ github.sha }} .
