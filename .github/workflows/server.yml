name: Server CI

on:
  pull_request:
    paths:
      - ".github/workflows/server.yml"
      - "internal/database/queries/suppressions.sql"
      - "internal/modules/suppression/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Regenerate suppression sqlc
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/suppressions-sqlc-repository
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate sqlc
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Format suppression repository
        run: gofmt -w internal/modules/suppression/repository.go

      - name: Test suppression packages
        run: go test ./internal/modules/suppression ./internal/transport/http/suppression

      - name: Commit generated output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/database/sqlc internal/modules/suppression/repository.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate suppression sqlc"
          git push origin HEAD:fix/suppressions-sqlc-repository
