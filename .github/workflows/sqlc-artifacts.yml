name: SQLC Generated Artifacts

on:
  pull_request:
    paths:
      - ".github/workflows/sqlc-artifacts.yml"
      - "migrations/**"
      - "sqlc.yaml"
      - "internal/database/queries/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate SQLC artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Generate and commit SQLC
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/database/sqlc
          if git diff --cached --quiet; then
            echo "Generated outputs are already current."
            exit 0
          fi
          git commit -m "Regenerate billing SQLC"
          git push
