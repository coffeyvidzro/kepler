name: Fix email attempt cutover guard v3

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-email-attempt-cutover-guard-v3.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Move legacy reference check after generation
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/cutover-email-delivery-attempts.yml")
          lines = path.read_text().splitlines()

          start = next(i for i, line in enumerate(lines) if line.strip() == "remaining = []")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == "- name: Set up Go")
          del lines[start:end]

          generate = next(i for i, line in enumerate(lines) if "sqlc@v1.31.1 generate" in line)
          guard = [
              "          if grep -R \"email_delivery_attempts\" --exclude='atlas.sum' --exclude='cutover-email-delivery-attempts.yml' --exclude-dir='.git' .; then",
              "            echo \"legacy email delivery attempt references remain\"",
              "            exit 1",
              "          fi",
          ]
          lines[generate + 1:generate + 1] = guard
          path.write_text("\n".join(lines) + "\n")

      - name: Commit guard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cutover-email-delivery-attempts.yml
          git commit -m "chore: validate attempt references after generation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
