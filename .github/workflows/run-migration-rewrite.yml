name: Run migration history rewrite

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/run-migration-rewrite.yml"

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Extract and apply staged migration payload
        shell: bash
        run: |
          awk '
            /^[[:space:]]*H4s/ { capture = 1 }
            /^[[:space:]]*PAYLOAD$/ { capture = 0 }
            capture {
              sub(/^[[:space:]]*/, "")
              print
            }
          ' .github/workflows/apply-migration-rewrite.yml > /tmp/migration-rewrite.b64
          base64 -d /tmp/migration-rewrite.b64 > /tmp/migration-rewrite.tgz
          rm -f \
            migrations/008_create_sender_ids.sql \
            migrations/009_create_sender_domains.sql \
            migrations/027_extend_event_delivery.sql \
            migrations/028_create_messaging_control_plane.sql \
            migrations/029_normalize_messaging_provider_ids.sql
          tar -xzf /tmp/migration-rewrite.tgz -C .

      - name: Commit rewritten migrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations
          git commit -m "refactor: rewrite unapplied messaging migrations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
