name: Remove sender compatibility storage

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/remove-sender-compatibility.yml"
      - ".github/scripts/remove_sender_compatibility.py"
      - ".github/scripts/finalize_sender_canonical.py"

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply canonical sender cutover
        run: |
          python .github/scripts/remove_sender_compatibility.py
          python .github/scripts/finalize_sender_canonical.py

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format, regenerate, and validate
        env:
          GOTOOLCHAIN: local
        run: |
          gofmt -w \
            internal/modules/senderid/repository.go \
            internal/modules/domain/repository.go \
            internal/modules/email/repository.go \
            internal/modules/sms/repository.go \
            internal/delivery/senderid/repository.go \
            internal/delivery/email/outbound/repository.go
          docker run --rm -v "$PWD/migrations:/migrations" arigaio/atlas:1.3.0 migrate hash --dir file:///migrations
          docker run --rm -v "$PWD/migrations:/migrations" arigaio/atlas:1.3.0 migrate validate --dir file:///migrations
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          if grep -R -n -E 'Compatibility|compatibility|legacy' migrations; then
            echo "non-canonical migration language remains"
            exit 1
          fi
          if grep -R -n -E '\b(sender_ids|sender_domains)\b' migrations internal/database/queries internal/modules internal/delivery; then
            echo "compatibility sender relations remain"
            exit 1
          fi
          if grep -R -n 'sender_domain_id' migrations internal/database/queries internal/modules internal/delivery; then
            echo "legacy sender domain column remains"
            exit 1
          fi
          go test -run '^$' ./...
          go vet ./internal/modules/senderid/... ./internal/modules/domain/... ./internal/modules/email/... ./internal/modules/sms/... ./internal/delivery/senderid/... ./internal/delivery/email/...
          go test -race ./internal/modules/senderid/... ./internal/modules/domain/... ./internal/delivery/senderid/... ./internal/delivery/email/...
          test -z "$(gofmt -l .)"
          git diff --exit-code -- go.mod go.sum

      - name: Commit canonical sender storage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations internal
          git commit -m "refactor: remove sender compatibility storage"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
