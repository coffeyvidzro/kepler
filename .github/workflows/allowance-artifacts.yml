name: Allowance Generated Artifacts

on:
  pull_request:
    paths:
      - ".github/workflows/allowance-artifacts.yml"
      - "migrations/**"
      - "sqlc.yaml"
      - "internal/database/queries/**"
      - "internal/platform/billing/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate SQLC and Atlas artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Generate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Generate Atlas checksum
        run: |
          docker run --rm \
            -v "${PWD}/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/database/sqlc migrations/atlas.sum
          if git diff --cached --quiet; then
            echo "Generated outputs are already current."
            exit 0
          fi
          git commit -m "Regenerate billing artifacts"
          git push
