name: Allowance Generated Artifacts

on:
  pull_request:
    paths:
      - ".github/workflows/allowance-artifacts.yml"
      - "migrations/**"
      - "sqlc.yaml"
      - "internal/database/queries/**"
      - "internal/platform/billing/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate SQLC and Atlas artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Generate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Generate Atlas checksum
        run: |
          docker run --rm \
            -v "${PWD}/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: allowance-generated-artifacts
          path: |
            internal/database/sqlc
            migrations/atlas.sum
          if-no-files-found: error
