name: Refactor sender ID storage

on:
  push:
    branches:
      - agent/create-sender-ids-aggregate
    paths:
      - .github/workflows/refactor-sender-id-storage.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/create-sender-ids-aggregate
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Refactor sender ID storage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              if old not in content:
                  raise SystemExit(f"expected block not found in {path}")
              file.write_text(content.replace(old, new), encoding="utf-8")

          write("internal/modules/senderid/repository.go", r'''package senderid

import (
	"context"
	"errors"
	"fmt"
	"strings"
	"time"

	"github.com/google/uuid"
	"github.com/jackc/pgx/v5"
	"github.com/jackc/pgx/v5/pgconn"
	"github.com/jackc/pgx/v5/pgtype"
	"github.com/jackc/pgx/v5/pgxpool"
)

var ErrSenderIDAlreadyExists = errors.New("sender id already exists")

type Repository struct {
	db *pgxpool.Pool
}

func NewRepository(db *pgxpool.Pool) *Repository {
	return &Repository{db: db}
}

type rowScanner interface {
	Scan(dest ...any) error
}

const senderIDProjection = `
	sender.id,
	sender.team_id,
	sender.name,
	sender.country_code::text,
	COALESCE(sender.purpose, ''),
	sender.status,
	sender.provider,
	sender.rejection_reason,
	sender.approved_at,
	sender.rejected_at,
	sender.suspended_at,
	sender.created_by,
	sender.created_at,
	sender.updated_at`

func (r *Repository) Create(
	ctx context.Context,
	teamID uuid.UUID,
	name string,
	countryCode string,
	purpose string,
	provider *string,
	createdBy uuid.UUID,
) (SenderID, error) {
	if r == nil || r.db == nil {
		return SenderID{}, errors.New("sender id repository is not configured")
	}

	displayName := strings.TrimSpace(name)
	normalizedName := strings.ToLower(displayName)
	countryCode = strings.ToUpper(strings.TrimSpace(countryCode))
	var normalizedProvider *string
	if provider != nil {
		value := strings.ToLower(strings.TrimSpace(*provider))
		if value != "" {
			normalizedProvider = &value
		}
	}

	sender, err := scanSenderID(r.db.QueryRow(ctx, `
		INSERT INTO sender_ids AS sender (
			team_id,
			name,
			normalized_name,
			country_code,
			purpose,
			provider,
			status,
			health_status,
			created_by
		)
		SELECT
			team.id,
			$2,
			$3,
			$4,
			NULLIF(trim($5), ''),
			$6,
			'pending',
			'unknown',
			$7
		FROM teams AS team
		WHERE team.id = $1
		  AND team.status = 'active'
		RETURNING `+senderIDProjection+`
	`, teamID, displayName, normalizedName, countryCode, purpose, normalizedProvider, createdBy))
	if err != nil {
		if isUniqueViolation(err) {
			return SenderID{}, ErrSenderIDAlreadyExists
		}
		return SenderID{}, fmt.Errorf("create sender id: %w", err)
	}
	return sender, nil
}

func (r *Repository) List(ctx context.Context, teamID uuid.UUID) ([]SenderID, error) {
	if r == nil || r.db == nil {
		return nil, errors.New("sender id repository is not configured")
	}
	rows, err := r.db.Query(ctx, `
		SELECT `+senderIDProjection+`
		FROM sender_ids AS sender
		JOIN teams AS team ON team.id = sender.team_id
		WHERE sender.team_id = $1
		  AND team.status = 'active'
		ORDER BY sender.created_at DESC, sender.id DESC
	`, teamID)
	if err != nil {
		return nil, fmt.Errorf("list sender ids: %w", err)
	}
	defer rows.Close()

	senders := make([]SenderID, 0)
	for rows.Next() {
		sender, err := scanSenderID(rows)
		if err != nil {
			return nil, fmt.Errorf("scan sender id: %w", err)
		}
		senders = append(senders, sender)
	}
	if err := rows.Err(); err != nil {
		return nil, fmt.Errorf("iterate sender ids: %w", err)
	}
	return senders, nil
}

func (r *Repository) Get(ctx context.Context, id uuid.UUID, teamID uuid.UUID) (SenderID, error) {
	if r == nil || r.db == nil {
		return SenderID{}, errors.New("sender id repository is not configured")
	}
	return getSenderID(ctx, r.db, id, teamID, false)
}

func (r *Repository) Delete(ctx context.Context, id uuid.UUID, teamID uuid.UUID) (SenderID, error) {
	if r == nil || r.db == nil {
		return SenderID{}, errors.New("sender id repository is not configured")
	}
	sender, err := scanSenderID(r.db.QueryRow(ctx, `
		DELETE FROM sender_ids AS sender
		USING teams AS team
		WHERE sender.id = $1
		  AND sender.team_id = $2
		  AND team.id = sender.team_id
		  AND team.status = 'active'
		RETURNING `+senderIDProjection+`
	`, id, teamID))
	if err != nil {
		return SenderID{}, fmt.Errorf("delete sender id: %w", err)
	}
	return sender, nil
}

type queryRower interface {
	QueryRow(context.Context, string, ...any) pgx.Row
}

func getSenderID(ctx context.Context, db queryRower, id, teamID uuid.UUID, lock bool) (SenderID, error) {
	query := `
		SELECT ` + senderIDProjection + `
		FROM sender_ids AS sender
		JOIN teams AS team ON team.id = sender.team_id
		WHERE sender.id = $1
		  AND sender.team_id = $2
		  AND team.status = 'active'`
	if lock {
		query += " FOR UPDATE OF sender"
	}
	sender, err := scanSenderID(db.QueryRow(ctx, query, id, teamID))
	if err != nil {
		return SenderID{}, fmt.Errorf("get sender id: %w", err)
	}
	return sender, nil
}

func scanSenderID(scanner rowScanner) (SenderID, error) {
	var id, teamID uuid.UUID
	var provider, rejectionReason *string
	var approvedAt, rejectedAt, suspendedAt, createdAt, updatedAt pgtype.Timestamptz
	var createdBy *uuid.UUID
	var name, countryCode, purpose, status string
	if err := scanner.Scan(
		&id,
		&teamID,
		&name,
		&countryCode,
		&purpose,
		&status,
		&provider,
		&rejectionReason,
		&approvedAt,
		&rejectedAt,
		&suspendedAt,
		&createdBy,
		&createdAt,
		&updatedAt,
	); err != nil {
		return SenderID{}, err
	}
	var createdByString *string
	if createdBy != nil {
		value := createdBy.String()
		createdByString = &value
	}
	return SenderID{
		ID:              id.String(),
		TeamID:          teamID.String(),
		Name:            name,
		CountryCode:     countryCode,
		Purpose:         purpose,
		Status:          status,
		Provider:        provider,
		RejectionReason: rejectionReason,
		ApprovedAt:      timestamptzPtr(approvedAt),
		RejectedAt:      timestamptzPtr(rejectedAt),
		SuspendedAt:     timestamptzPtr(suspendedAt),
		CreatedBy:       createdByString,
		CreatedAt:       createdAt.Time,
		UpdatedAt:       updatedAt.Time,
	}, nil
}

func timestamptzPtr(value pgtype.Timestamptz) *time.Time {
	if !value.Valid {
		return nil
	}
	result := value.Time
	return &result
}

func isUniqueViolation(err error) bool {
	var pgErr *pgconn.PgError
	return errors.As(err, &pgErr) && pgErr.Code == "23505"
}
''')

          write("internal/delivery/senderid/repository.go", r'''package senderidreconciliation

import (
	"context"
	"errors"
	"fmt"
	"strings"
	"time"

	"github.com/google/uuid"
	"github.com/jackc/pgx/v5/pgtype"
	"github.com/jackc/pgx/v5/pgxpool"
)

type RegistrationClaim struct {
	ID                  uuid.UUID
	Name                string
	CountryCode         string
	Provider            string
	ProviderStatus      string
	ProviderSubmittedAt *time.Time
	Attempt             int32
}

type registrationRepository interface {
	ClaimPendingRegistrations(context.Context, string, string, int32, time.Time) ([]RegistrationClaim, error)
	CompleteSubmission(context.Context, uuid.UUID, string, string, time.Time) error
	CompleteStatus(context.Context, uuid.UUID, string, string, string, bool, *string, time.Time) error
	RecordProviderFailure(context.Context, uuid.UUID, string, string, error, time.Time) error
}

type Repository struct {
	db *pgxpool.Pool
}

func NewRepository(db *pgxpool.Pool) *Repository {
	return &Repository{db: db}
}

func (repository *Repository) ClaimPendingRegistrations(
	ctx context.Context,
	workerID string,
	providerID string,
	limit int32,
	staleBefore time.Time,
) ([]RegistrationClaim, error) {
	if repository == nil || repository.db == nil {
		return nil, errors.New("sender ID repository is not configured")
	}
	workerID = strings.TrimSpace(workerID)
	providerID = strings.ToLower(strings.TrimSpace(providerID))
	if workerID == "" || providerID == "" {
		return nil, errors.New("sender ID reconciliation requires worker and provider IDs")
	}
	if limit <= 0 {
		limit = 25
	}

	rows, err := repository.db.Query(ctx, `
		WITH candidates AS (
			SELECT sender.id
			FROM sender_ids AS sender
			WHERE sender.country_code = 'GH'
			  AND sender.provider IS NOT NULL
			  AND lower(sender.provider) = $1
			  AND sender.status = 'pending'
			  AND sender.next_check_at <= now()
			  AND (
				sender.reconcile_locked_at IS NULL
				OR sender.reconcile_locked_at < $4
			  )
			ORDER BY sender.next_check_at, sender.created_at, sender.id
			FOR UPDATE OF sender SKIP LOCKED
			LIMIT $3
		), updated AS (
			UPDATE sender_ids AS sender
			SET reconcile_locked_at = now(),
				reconcile_locked_by = $2,
				reconciliation_attempts = sender.reconciliation_attempts + 1,
				updated_at = now()
			FROM candidates
			WHERE sender.id = candidates.id
			RETURNING sender.*
		)
		SELECT sender.id,
			sender.name,
			sender.country_code::text,
			COALESCE(sender.provider, ''),
			COALESCE(sender.provider_status, ''),
			sender.submitted_at,
			sender.reconciliation_attempts
		FROM updated AS sender
		ORDER BY sender.next_check_at, sender.created_at, sender.id
	`, providerID, workerID, limit, staleBefore)
	if err != nil {
		return nil, fmt.Errorf("claim pending Sender ID registrations: %w", err)
	}
	defer rows.Close()

	claims := make([]RegistrationClaim, 0, limit)
	for rows.Next() {
		var claim RegistrationClaim
		var submittedAt pgtype.Timestamptz
		if err := rows.Scan(
			&claim.ID,
			&claim.Name,
			&claim.CountryCode,
			&claim.Provider,
			&claim.ProviderStatus,
			&submittedAt,
			&claim.Attempt,
		); err != nil {
			return nil, fmt.Errorf("scan Sender ID registration claim: %w", err)
		}
		if submittedAt.Valid {
			value := submittedAt.Time
			claim.ProviderSubmittedAt = &value
		}
		claims = append(claims, claim)
	}
	if err := rows.Err(); err != nil {
		return nil, fmt.Errorf("iterate Sender ID registration claims: %w", err)
	}
	return claims, nil
}

func (repository *Repository) CompleteSubmission(
	ctx context.Context,
	id uuid.UUID,
	workerID string,
	providerStatus string,
	nextCheckAt time.Time,
) error {
	if repository == nil || repository.db == nil {
		return errors.New("sender ID repository is not configured")
	}
	result, err := repository.db.Exec(ctx, `
		UPDATE sender_ids
		SET provider_status = $3,
			submitted_at = COALESCE(submitted_at, now()),
			last_checked_at = now(),
			next_check_at = $4,
			reconciliation_attempts = 0,
			last_error = NULL,
			reconcile_locked_at = NULL,
			reconcile_locked_by = NULL,
			updated_at = now()
		WHERE id = $1
		  AND reconcile_locked_by = $2
	`, id, strings.TrimSpace(workerID), strings.TrimSpace(providerStatus), nextCheckAt)
	if err != nil {
		return fmt.Errorf("complete Sender ID registration claim: %w", err)
	}
	if result.RowsAffected() != 1 {
		return ErrRegistrationClaimLost
	}
	return nil
}

func (repository *Repository) CompleteStatus(
	ctx context.Context,
	id uuid.UUID,
	workerID string,
	status string,
	providerStatus string,
	whitelisted bool,
	rejectionReason *string,
	nextCheckAt time.Time,
) error {
	if repository == nil || repository.db == nil {
		return errors.New("sender ID repository is not configured")
	}
	status = strings.ToLower(strings.TrimSpace(status))
	result, err := repository.db.Exec(ctx, `
		UPDATE sender_ids
		SET status = $3,
			provider_status = $4,
			provider_whitelisted = $5,
			health_status = CASE
				WHEN $3 = 'approved' AND $5 THEN 'healthy'
				WHEN $3 IN ('rejected', 'suspended') THEN 'degraded'
				ELSE health_status
			END,
			submitted_at = COALESCE(submitted_at, now()),
			last_checked_at = now(),
			next_check_at = $7,
			reconciliation_attempts = 0,
			last_error = NULL,
			rejection_reason = CASE WHEN $3 = 'rejected' THEN $6 ELSE NULL END,
			approved_at = CASE
				WHEN $3 = 'approved' THEN COALESCE(approved_at, now())
				ELSE approved_at
			END,
			rejected_at = CASE
				WHEN $3 = 'rejected' THEN COALESCE(rejected_at, now())
				ELSE rejected_at
			END,
			suspended_at = CASE
				WHEN $3 = 'suspended' THEN COALESCE(suspended_at, now())
				ELSE suspended_at
			END,
			disabled_at = CASE
				WHEN $3 = 'inactive' THEN COALESCE(disabled_at, now())
				ELSE disabled_at
			END,
			reconcile_locked_at = NULL,
			reconcile_locked_by = NULL,
			updated_at = now()
		WHERE id = $1
		  AND reconcile_locked_by = $2
	`, id, strings.TrimSpace(workerID), status, strings.TrimSpace(providerStatus), whitelisted, rejectionReason, nextCheckAt)
	if err != nil {
		return fmt.Errorf("complete Sender ID provider status: %w", err)
	}
	if result.RowsAffected() != 1 {
		return ErrRegistrationClaimLost
	}
	return nil
}

func (repository *Repository) RecordProviderFailure(
	ctx context.Context,
	id uuid.UUID,
	workerID string,
	providerStatus string,
	providerError error,
	nextCheckAt time.Time,
) error {
	if repository == nil || repository.db == nil {
		return errors.New("sender ID repository is not configured")
	}
	message := "sender ID provider operation failed"
	if providerError != nil {
		message = providerError.Error()
	}
	result, err := repository.db.Exec(ctx, `
		UPDATE sender_ids
		SET provider_status = COALESCE(NULLIF($3, ''), provider_status),
			last_checked_at = now(),
			next_check_at = $5,
			last_error = $4,
			reconcile_locked_at = NULL,
			reconcile_locked_by = NULL,
			updated_at = now()
		WHERE id = $1
		  AND reconcile_locked_by = $2
	`, id, strings.TrimSpace(workerID), strings.TrimSpace(providerStatus), message, nextCheckAt)
	if err != nil {
		return fmt.Errorf("record Sender ID provider failure: %w", err)
	}
	if result.RowsAffected() != 1 {
		return ErrRegistrationClaimLost
	}
	return nil
}
''')

          write("internal/delivery/messaging/routing/repository.go", r'''package messagingrouting

import (
	"context"
	"fmt"
	"strings"

	"github.com/jackc/pgx/v5"

	"github.com/coffeyvidzro/dugble/server/internal/platform/messaging"
	platformrouting "github.com/coffeyvidzro/dugble/server/internal/platform/messaging/routing"
	"github.com/coffeyvidzro/dugble/server/internal/platform/messaging/sender"
)

type DBTX interface {
	Query(context.Context, string, ...any) (pgx.Rows, error)
}

type Repository struct {
	db DBTX
}

func NewRepository(db DBTX) *Repository {
	return &Repository{db: db}
}

func Resolve(ctx context.Context, db DBTX, request platformrouting.Request) (platformrouting.Route, error) {
	resolver, err := platformrouting.NewResolver(NewRepository(db), platformrouting.DeterministicStrategy{})
	if err != nil {
		return platformrouting.Route{}, err
	}
	return resolver.Resolve(ctx, request)
}

func ResolveAll(ctx context.Context, db DBTX, request platformrouting.Request) ([]platformrouting.Route, error) {
	resolver, err := platformrouting.NewResolver(NewRepository(db), platformrouting.DeterministicStrategy{})
	if err != nil {
		return nil, err
	}
	return resolver.ResolveAll(ctx, request)
}

func (repository *Repository) ListCandidates(
	ctx context.Context,
	request platformrouting.Request,
) ([]platformrouting.Candidate, error) {
	if repository == nil || repository.db == nil {
		return nil, fmt.Errorf("messaging routing repository is not configured")
	}
	switch request.Channel {
	case messaging.ChannelEmail:
		return repository.listEmailCandidates(ctx, request)
	case messaging.ChannelSMS:
		return repository.listSMSCandidates(ctx, request)
	default:
		return nil, fmt.Errorf("messaging routing channel is invalid")
	}
}

func (repository *Repository) listSMSCandidates(
	ctx context.Context,
	request platformrouting.Request,
) ([]platformrouting.Candidate, error) {
	rows, err := repository.db.Query(ctx, `
		SELECT sender_record.id,
			'sms',
			sender_record.name,
			sender_record.normalized_name,
			CASE sender_record.status
				WHEN 'approved' THEN 'active'
				WHEN 'inactive' THEN 'disabled'
				WHEN 'rejected' THEN 'failed'
				ELSE sender_record.status
			END,
			sender_record.health_status,
			sender_record.id,
			sender_record.team_id,
			sender_record.id,
			'sms',
			'active',
			false,
			false,
			sender_record.id,
			sender_record.id,
			COALESCE(sender_record.provider, ''),
			'default',
			'',
			sender_record.country_code::text,
			CASE sender_record.status
				WHEN 'approved' THEN 'active'
				WHEN 'inactive' THEN 'disabled'
				ELSE sender_record.status
			END,
			sender_record.provider_whitelisted,
			sender_record.health_status
		FROM sender_ids AS sender_record
		JOIN teams AS team ON team.id = sender_record.team_id
		WHERE sender_record.team_id = $1
		  AND team.status = 'active'
		  AND sender_record.provider IS NOT NULL
		  AND sender_record.disabled_at IS NULL
		ORDER BY sender_record.provider, sender_record.country_code, sender_record.created_at, sender_record.id
		FOR SHARE OF sender_record
	`, request.TeamID)
	if err != nil {
		return nil, fmt.Errorf("query SMS route candidates: %w", err)
	}
	return scanCandidates(rows, messaging.ChannelSMS)
}

func (repository *Repository) listEmailCandidates(
	ctx context.Context,
	request platformrouting.Request,
) ([]platformrouting.Candidate, error) {
	rows, err := repository.db.Query(ctx, `
		SELECT domain_record.id,
			'email',
			domain_record.name,
			domain_record.normalized_name,
			CASE domain_record.status
				WHEN 'verified' THEN 'active'
				WHEN 'disabled' THEN 'disabled'
				WHEN 'failed' THEN 'failed'
				WHEN 'partially_failed' THEN 'degraded'
				WHEN 'temporary_failure' THEN 'degraded'
				ELSE 'pending'
			END,
			domain_record.health_status,
			domain_record.id,
			domain_record.team_id,
			domain_record.id,
			'email',
			'active',
			false,
			false,
			domain_record.id,
			domain_record.id,
			domain_record.provider,
			domain_record.provider_account,
			domain_record.provider_region,
			'',
			CASE domain_record.status
				WHEN 'verified' THEN 'active'
				WHEN 'disabled' THEN 'disabled'
				WHEN 'failed' THEN 'failed'
				WHEN 'partially_failed' THEN 'failed'
				WHEN 'temporary_failure' THEN 'unknown'
				ELSE 'pending'
			END,
			(domain_record.status = 'verified'),
			domain_record.health_status
		FROM domains AS domain_record
		JOIN teams AS team ON team.id = domain_record.team_id
		WHERE domain_record.team_id = $1
		  AND team.status = 'active'
		  AND domain_record.sending_enabled
		  AND domain_record.disabled_at IS NULL
		ORDER BY domain_record.provider, domain_record.provider_account,
			domain_record.provider_region, domain_record.created_at, domain_record.id
		FOR SHARE OF domain_record
	`, request.TeamID)
	if err != nil {
		return nil, fmt.Errorf("query email route candidates: %w", err)
	}
	return scanCandidates(rows, messaging.ChannelEmail)
}

func scanCandidates(rows pgx.Rows, channel messaging.Channel) ([]platformrouting.Candidate, error) {
	defer rows.Close()
	candidates := make([]platformrouting.Candidate, 0)
	for rows.Next() {
		var candidate platformrouting.Candidate
		var revoked bool
		if err := rows.Scan(
			&candidate.Asset.ID,
			&candidate.Asset.Channel,
			&candidate.Asset.Identity,
			&candidate.Asset.NormalizedIdentity,
			&candidate.Asset.Status,
			&candidate.Asset.HealthStatus,
			&candidate.Grant.ID,
			&candidate.Grant.TeamID,
			&candidate.Grant.SenderAssetID,
			&candidate.Grant.Channel,
			&candidate.Grant.Status,
			&candidate.Grant.Default,
			&revoked,
			&candidate.Binding.ID,
			&candidate.Binding.SenderAssetID,
			&candidate.Binding.Provider,
			&candidate.Binding.ProviderAccount,
			&candidate.Binding.Region,
			&candidate.Binding.CountryCode,
			&candidate.Binding.Status,
			&candidate.Binding.Verified,
			&candidate.Binding.HealthStatus,
		); err != nil {
			return nil, fmt.Errorf("scan messaging route candidate: %w", err)
		}
		teamID := candidate.Grant.TeamID
		candidate.Asset.OwnerType = sender.OwnerTeam
		candidate.Asset.TeamID = &teamID
		candidate.Capabilities = capabilitiesFor(
			channel,
			candidate.Binding.Region,
			candidate.Binding.CountryCode,
		)
		candidates = append(candidates, candidate)
	}
	if err := rows.Err(); err != nil {
		return nil, fmt.Errorf("iterate messaging route candidates: %w", err)
	}
	return candidates, nil
}

func capabilitiesFor(channel messaging.Channel, region string, country string) sender.CapabilitySet {
	capabilities := make(sender.CapabilitySet)
	switch channel {
	case messaging.ChannelEmail:
		capabilities[sender.CapabilityDomainVerification] = struct{}{}
		capabilities[sender.CapabilityPushDeliveryFeedback] = struct{}{}
	case messaging.ChannelSMS:
		capabilities[sender.CapabilitySenderIDRegistration] = struct{}{}
		capabilities[sender.CapabilityPollDeliveryFeedback] = struct{}{}
	}
	if strings.TrimSpace(region) != "" || strings.TrimSpace(country) != "" {
		capabilities[sender.CapabilityGeographicRouting] = struct{}{}
	}
	return capabilities
}
''')

          write("internal/database/queries/sms_messages.sql", r'''-- name: CreateSMSMessage :one
INSERT INTO sms_messages (
    team_id,
    sender_id,
    to_number,
    from_name,
    body,
    status,
    segments,
    metadata,
    tags,
    scheduled_at,
    destination_country
) VALUES (
    sqlc.arg(team_id),
    sqlc.narg(sender_id),
    sqlc.arg(to_number),
    sqlc.arg(from_name),
    sqlc.arg(body),
    sqlc.arg(status),
    sqlc.arg(segments),
    sqlc.arg(metadata),
    sqlc.arg(tags),
    sqlc.narg(scheduled_at),
    sqlc.arg(destination_country)
)
RETURNING *;

-- name: ListSMSMessages :many
SELECT *
FROM sms_messages
WHERE team_id = sqlc.arg(team_id)
ORDER BY created_at DESC
LIMIT sqlc.arg(limit_count)
OFFSET sqlc.arg(offset_count);

-- name: GetSMSMessage :one
SELECT *
FROM sms_messages
WHERE id = sqlc.arg(id)
  AND team_id = sqlc.arg(team_id);

-- name: MarkSMSMessageSubmitted :one
UPDATE sms_messages
SET provider_id = sqlc.arg(provider_id),
    provider_message_id = sqlc.arg(provider_message_id),
    status = sqlc.arg(status),
    error_message = NULL,
    submitted_at = COALESCE(submitted_at, now()),
    updated_at = now()
WHERE id = sqlc.arg(id)
  AND team_id = sqlc.arg(team_id)
RETURNING *;

-- name: MarkSMSMessageFailed :one
UPDATE sms_messages
SET status = 'failed',
    error_message = sqlc.arg(error_message),
    updated_at = now()
WHERE id = sqlc.arg(id)
  AND team_id = sqlc.arg(team_id)
RETURNING *;

-- name: UpdateSMSMessageStatus :one
UPDATE sms_messages
SET status = sqlc.arg(status),
    delivered_at = CASE
        WHEN sqlc.arg(status) = 'delivered'
            THEN COALESCE(delivered_at, now())
        ELSE delivered_at
    END,
    updated_at = now()
WHERE id = sqlc.arg(id)
  AND team_id = sqlc.arg(team_id)
  AND status <> sqlc.arg(status)
  AND status NOT IN ('delivered', 'undelivered', 'rejected', 'failed', 'expired', 'unknown', 'canceled')
  AND (
      sqlc.arg(status) IN ('delivered', 'undelivered', 'rejected', 'failed', 'expired')
      OR CASE status
          WHEN 'queued' THEN 0
          WHEN 'processing' THEN 1
          WHEN 'submitted' THEN 2
          WHEN 'sent' THEN 3
          ELSE 4
      END < CASE sqlc.arg(status)
          WHEN 'queued' THEN 0
          WHEN 'processing' THEN 1
          WHEN 'submitted' THEN 2
          WHEN 'sent' THEN 3
          ELSE -1
      END
  )
RETURNING *;

-- name: FindApprovedSMSSender :one
SELECT sender.id
FROM sender_ids AS sender
WHERE sender.team_id = sqlc.arg(team_id)
  AND sender.normalized_name = lower(trim(sqlc.arg(name)))
  AND sender.status = 'approved'
  AND sender.provider_whitelisted
  AND sender.disabled_at IS NULL
ORDER BY sender.created_at DESC, sender.id DESC
LIMIT 1;

-- name: MarkSMSMessageProcessing :one
UPDATE sms_messages
SET status = 'processing',
    error_message = NULL,
    updated_at = now()
WHERE id = sqlc.arg(id)
  AND team_id = sqlc.arg(team_id)
  AND status = 'queued'
  AND provider_message_id IS NULL
RETURNING *;

-- name: MarkSMSMessageDeliveryUnknown :one
UPDATE sms_messages
SET status = 'unknown',
    error_message = sqlc.arg(error_message),
    updated_at = now()
WHERE id = sqlc.arg(id)
  AND team_id = sqlc.arg(team_id)
  AND status = 'processing'
  AND provider_message_id IS NULL
RETURNING *;
''')

