name: Refactor sender ID storage

on:
  push:
    branches:
      - agent/create-sender-ids-aggregate
    paths:
      - .github/workflows/refactor-sender-id-storage.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/create-sender-ids-aggregate
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore original refactor script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              [
                  "git",
                  "show",
                  "172e411fd716f4488b2c4c5465b75e2e209e9065:.github/workflows/refactor-sender-id-storage.yml",
              ],
              text=True,
          )
          lines = source.splitlines()
          step_index = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == "- name: Refactor sender ID storage"
          )
          run_index = next(
              index
              for index in range(step_index + 1, len(lines))
              if lines[index].strip() == "run: |"
          )
          end_index = next(
              (
                  index
                  for index in range(run_index + 1, len(lines))
                  if lines[index].startswith("      - name:")
              ),
              len(lines),
          )

          yaml_indent = "          "
          script_lines = []
          for line_number, line in enumerate(
              lines[run_index + 1 : end_index],
              start=run_index + 2,
          ):
              if line == "":
                  script_lines.append("")
                  continue
              if not line.startswith(yaml_indent):
                  raise SystemExit(
                      f"unexpected indentation at source line {line_number}: {line!r}"
                  )
              script_lines.append(line[len(yaml_indent) :])

          script = "\n".join(script_lines) + "\n"
          if not script.startswith("python3 - <<'PY'\n"):
              raise SystemExit("refactor script does not start with the expected heredoc")
          if "\nPY\n" not in script:
              raise SystemExit("refactor script is missing its heredoc terminator")

          Path("/tmp/refactor-sender-id-storage.sh").write_text(
              script,
              encoding="utf-8",
          )
          PY
          bash -n /tmp/refactor-sender-id-storage.sh
          bash /tmp/refactor-sender-id-storage.sh

      - name: Regenerate sqlc
        shell: bash
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          "$(go env GOPATH)/bin/sqlc" generate

      - name: Regenerate migration checksums
        shell: bash
        run: |
          docker run --rm \
            -v "${PWD}/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Format Go files
        shell: bash
        run: |
          gofmt -w \
            internal/modules/senderid/repository.go \
            internal/delivery/senderid/repository.go \
            internal/delivery/messaging/routing/repository.go \
            internal/modules/sms/repository.go \
            internal/delivery/messaging/feedback/repository.go

      - name: Verify old SQL references are gone
        shell: bash
        run: |
          if grep -RInE \
            --include='*.go' \
            --include='*.sql' \
            'sender_assets|sender_asset_grants|sender_provider_bindings|sender_provider_binding_id|sender_asset_id' \
            internal migrations; then
            echo 'old sender storage references remain' >&2
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Commit refactor and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-sender-id-storage.yml
          git rm .github/workflows/messaging-e2e.yml
          git add .github migrations internal
          git commit -m "Refactor sender ID storage"
          git push origin HEAD:agent/create-sender-ids-aggregate
