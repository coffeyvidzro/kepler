name: Adapt sender compatibility view callers

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-sender-view-callers.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Adapt SQLC parameters
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path("internal/modules/email/repository.go"),
              Path("internal/modules/sms/repository.go"),
              Path("internal/modules/domain/repository.go"),
              Path("internal/modules/senderid/repository.go"),
          ]
          changed = 0
          for path in paths:
              source = path.read_text()
              updated = source.replace("TeamID: teamID", "TeamID: &teamID")
              if updated != source:
                  path.write_text(updated)
                  changed += source.count("TeamID: teamID")
          if changed != 10:
              raise SystemExit(f"expected 10 TeamID adaptations, found {changed}")

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Format and test
        run: |
          gofmt -w \
            internal/modules/email/repository.go \
            internal/modules/sms/repository.go \
            internal/modules/domain/repository.go \
            internal/modules/senderid/repository.go
          go test ./...

      - name: Commit caller adaptations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/modules/email/repository.go \
            internal/modules/sms/repository.go \
            internal/modules/domain/repository.go \
            internal/modules/senderid/repository.go
          git commit -m "fix: adapt SQLC callers to sender compatibility views"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
