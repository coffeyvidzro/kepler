name: Adapt sender compatibility view callers

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-sender-view-callers.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Adapt SQLC parameters
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = {
              Path("internal/modules/email/repository.go"): [
                  "GetSenderDomainByDomainParams",
              ],
              Path("internal/modules/sms/repository.go"): [
                  "FindApprovedSMSSenderParams",
              ],
              Path("internal/modules/domain/repository.go"): [
                  "CreateSenderDomainParams",
                  "ListSenderDomainsParams",
                  "GetSenderDomainParams",
                  "UpdateSenderDomainVerificationParams",
                  "DeleteSenderDomainParams",
              ],
              Path("internal/modules/senderid/repository.go"): [
                  "ListSenderIDsParams",
                  "GetSenderIDParams",
                  "DeleteSenderIDParams",
              ],
          }

          changed = 0
          for path, names in targets.items():
              source = path.read_text()
              for name in names:
                  pattern = rf"({name}\{{[^}}]*?\bTeamID:\s*)teamID"
                  source, count = re.subn(pattern, r"\1&teamID", source, count=1, flags=re.DOTALL)
                  if count != 1:
                      raise SystemExit(f"expected one {name} TeamID adaptation in {path}, found {count}")
                  changed += count
              path.write_text(source)

          if changed != 10:
              raise SystemExit(f"expected 10 TeamID adaptations, found {changed}")

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Format and compile all packages
        run: |
          gofmt -w \
            internal/modules/email/repository.go \
            internal/modules/sms/repository.go \
            internal/modules/domain/repository.go \
            internal/modules/senderid/repository.go
          go test -run '^$' ./...

      - name: Commit caller adaptations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/modules/email/repository.go \
            internal/modules/sms/repository.go \
            internal/modules/domain/repository.go \
            internal/modules/senderid/repository.go
          git commit -m "fix: adapt SQLC callers to sender compatibility views"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
