name: Refactor messaging package layout

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/refactor-messaging-layout.yml"
      - ".github/scripts/refactor_messaging_layout.py"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply package refactor
        run: python .github/scripts/refactor_messaging_layout.py

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate messaging packages
        env:
          GOTOOLCHAIN: local
        run: |
          gofmt -w internal/platform/messaging
          test ! -e internal/platform/messaging/sender/model.go
          test ! -e internal/platform/messaging/delivery/model.go
          test -e internal/platform/messaging/sender/asset.go
          test -e internal/platform/messaging/sender/binding.go
          test -e internal/platform/messaging/sender/grant.go
          test -e internal/platform/messaging/sender/status.go
          test -e internal/platform/messaging/sender/capability.go
          test -e internal/platform/messaging/delivery/message.go
          test -e internal/platform/messaging/delivery/attempt.go
          test -e internal/platform/messaging/delivery/status.go
          test -e internal/platform/messaging/delivery/transition.go
          test -e internal/platform/messaging/feedback/event.go
          test -e internal/platform/messaging/feedback/processor.go
          test -e internal/platform/messaging/feedback/repository.go
          test -e internal/platform/messaging/feedback/retry.go
          test -e internal/platform/messaging/routing/resolver.go
          test -e internal/platform/messaging/routing/eligibility.go
          test -e internal/platform/messaging/routing/strategy.go
          go test -race ./internal/platform/messaging/...
          go vet ./internal/platform/messaging/...
          go test -run '^$' ./...
          test -z "$(gofmt -l internal/platform/messaging)"
          git diff --exit-code -- go.mod go.sum

      - name: Commit package refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/platform/messaging
          git commit -m "refactor: organize messaging domain packages"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
