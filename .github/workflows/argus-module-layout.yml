name: Argus Module Layout

on:
  push:
    branches:
      - "fix/simplify-argus-verification"

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/simplify-argus-verification
      - name: Consolidate Argus module files
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("internal/modules/argus")

          def body(name: str) -> str:
              text = (root / name).read_text()
              prefix = "package argus\n"
              if not text.startswith(prefix):
                  raise RuntimeError(f"unexpected package declaration in {name}")
              text = text[len(prefix):].lstrip()
              if text.startswith("import ("):
                  end = text.index("\n)\n")
                  text = text[end + 3:]
              elif text.startswith("import "):
                  text = text.split("\n", 1)[1]
              return text.lstrip()

          service_header = '''package argus

          import (
          \t"context"
          \t"encoding/json"
          \t"errors"
          \t"fmt"
          \t"strings"
          \t"time"

          \t"github.com/google/uuid"
          \t"github.com/jackc/pgx/v5"
          \t"github.com/jackc/pgx/v5/pgtype"

          \t"github.com/coffeyvidzro/dugble/server/internal/adapters/postgres"
          \targusdispatch "github.com/coffeyvidzro/dugble/server/internal/delivery/argus/dispatch"
          \tplatformevent "github.com/coffeyvidzro/dugble/server/internal/platform/event"
          \t"github.com/coffeyvidzro/dugble/server/internal/platform/tenant"
          \tapperrors "github.com/coffeyvidzro/dugble/server/pkg/errors"
          )

          '''
          service_parts = [
              body("service.go"),
              body("service_verifications.go"),
              body("service_lifecycle.go"),
              body("service_helpers.go"),
          ]
          (root / "service.go").write_text(service_header + "\n".join(service_parts))

          validation_header = '''package argus

          import (
          \t"bytes"
          \t"encoding/json"
          \t"net/mail"
          \t"strings"
          \t"time"
          \t"unicode"

          \tapperrors "github.com/coffeyvidzro/dugble/server/pkg/errors"
          )

          '''
          validation_parts = [
              body("validation.go"),
              body("lifecycle_policy.go"),
          ]
          (root / "validation.go").write_text(validation_header + "\n".join(validation_parts))

          for name in (
              "service_verifications.go",
              "service_lifecycle.go",
              "service_helpers.go",
              "lifecycle_policy.go",
          ):
              (root / name).unlink()
          PY
          gofmt -w internal/modules/argus/service.go internal/modules/argus/validation.go
      - name: Commit consolidated layout
        run: |
          rm -f .github/workflows/argus-module-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A internal/modules/argus .github/workflows/argus-module-layout.yml
          git diff --cached --quiet && exit 0
          git commit -m "consolidate Argus module files"
          git push origin HEAD:fix/simplify-argus-verification
