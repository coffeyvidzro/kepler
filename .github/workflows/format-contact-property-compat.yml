name: Format contact property compatibility

on:
  push:
    branches:
      - agent/contact-property-compatibility

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/contact-property-compatibility
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format touched Go files
        run: |
          gofmt -w \
            internal/modules/contactproperty/model.go \
            internal/modules/contactproperty/model_test.go \
            internal/modules/contactproperty/repository.go \
            internal/modules/contactproperty/service.go \
            internal/transport/http/contactproperty/handler.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/modules/contactproperty/model.go \
            internal/modules/contactproperty/model_test.go \
            internal/modules/contactproperty/repository.go \
            internal/modules/contactproperty/service.go \
            internal/transport/http/contactproperty/handler.go
          git commit -m "Format contact property compatibility changes"
          git push origin HEAD:agent/contact-property-compatibility
