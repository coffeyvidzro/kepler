name: Agent remove verify abuse

on:
  push:
    branches:
      - agent/remove-verify-abuse

permissions:
  contents: write

jobs:
  remove-abuse:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-verify-abuse
          fetch-depth: 0

      - name: Remove verification abuse controls
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int | None = None) -> None:
              target = Path(path)
              text = target.read_text()
              occurrences = text.count(old)
              expected = 1 if count is None else count
              if occurrences != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {occurrences}")
              target.write_text(text.replace(old, new, expected))

          Path("internal/modules/verify/abuse.go").unlink()
          Path("internal/modules/verify/abuse_service.go").unlink()

          replace(
              "internal/modules/verify/service.go",
              "\tabuse      abuseControls\n",
              "",
          )
          replace(
              "internal/modules/verify/service.go",
              "\nfunc (service *Service) WithAbuseControls(controls abuseControls) *Service {\n\tservice.abuse = controls\n\treturn service\n}\n",
              "",
          )

          replace(
              "internal/modules/verify/service_verifications.go",
              "\t\tif service.abuse != nil {\n\t\t\tif abuseErr := service.abuse.AllowCreate(\n\t\t\t\tctx,\n\t\t\t\taccess.Scope.TeamID,\n\t\t\t\tserviceID,\n\t\t\t\tvalidated.RecipientNormalized,\n\t\t\t\treq.IPHash,\n\t\t\t); abuseErr != nil {\n\t\t\t\treturn Verification{}, abuseErr\n\t\t\t}\n\t\t}\n",
              "",
          )

          replace(
              "internal/modules/verify/model.go",
              "\tMetadata  json.RawMessage `json:\"metadata,omitempty\"`\n\tIPHash    []byte          `json:\"-\"`\n}\n\ntype CheckRequest struct",
              "\tMetadata  json.RawMessage `json:\"metadata,omitempty\"`\n}\n\ntype CheckRequest struct",
          )

          replace(
              "internal/transport/http/verify/handler.go",
              "\tif err := decodeJSON(c, &req); err != nil {\n\t\treturn err\n\t}\n\treq.IPHash = requestIPHash(c)\n\tresult, err := handler.service.Create(c.Request().Context(), req)",
              "\tif err := decodeJSON(c, &req); err != nil {\n\t\treturn err\n\t}\n\tresult, err := handler.service.Create(c.Request().Context(), req)",
          )
          replace(
              "internal/transport/http/verify/handler.go",
              "\tif err := handler.service.EnforceCheckAbuse(\n\t\tc.Request().Context(),\n\t\tc.Param(\"verification_id\"),\n\t\tAbuseContext{IPHash: req.IPHash},\n\t); err != nil {\n\t\treturn httputil.Error(c, err)\n\t}\n",
              "",
          )
          replace(
              "internal/transport/http/verify/handler.go",
              "\tif err := handler.service.EnforceResendAbuse(\n\t\tc.Request().Context(),\n\t\tc.Param(\"verification_id\"),\n\t\tAbuseContext{IPHash: requestIPHash(c)},\n\t); err != nil {\n\t\treturn httputil.Error(c, err)\n\t}\n",
              "",
          )

          replace(
              "internal/transport/http/verify/module.go",
              "type AbuseContext = verifymodule.AbuseContext\n",
              "",
          )

          replace(
              "internal/dugble/server/wire.go",
              "\tverifyAbuse, err := verifymodule.NewRedisAbuseControls(\n\t\tredisClient,\n\t\tverifySecret,\n\t\tverifymodule.DefaultAbusePolicy(),\n\t)\n\tif err != nil {\n\t\treturn fail(fmt.Errorf(\"initialize verify abuse controls: %w\", err))\n\t}\n",
              "",
          )
          replace(
              "internal/dugble/server/wire.go",
              "\t).WithAbuseControls(verifyAbuse)\n",
              "\t)\n",
          )
          PY

          git diff --name-only --diff-filter=ACM -- '*.go' | xargs -r gofmt -w

          if git grep -ni 'abuse' -- internal/modules/verify internal/transport/http/verify internal/dugble/server/wire.go; then
            echo 'verification abuse references remain' >&2
            exit 1
          fi

          go test ./internal/modules/verify ./internal/transport/http/verify ./internal/dugble/server

          rm -f .github/workflows/agent-remove-verify-abuse.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove abuse controls from verification'
          git push origin HEAD:agent/remove-verify-abuse
