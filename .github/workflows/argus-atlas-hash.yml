name: Argus Atlas Hash

on:
  push:
    branches:
      - "fix/simplify-argus-verification"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/simplify-argus-verification
      - name: Rehash migrations
        run: |
          docker run --rm \
            -v "${PWD}/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations
      - name: Commit checksum
        run: |
          rm -f .github/workflows/argus-atlas-hash.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/atlas.sum .github/workflows/argus-atlas-hash.yml
          git commit -m "rehash Argus migration"
          git push origin HEAD:fix/simplify-argus-verification
