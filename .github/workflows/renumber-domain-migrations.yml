name: Renumber Domain Migrations

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/renumber-domain-migrations.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renumber-domain-migrations
  cancel-in-progress: false

jobs:
  renumber:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/create-domains-aggregate
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Renumber migration files
        shell: bash
        run: |
          set -euo pipefail

          git mv migrations/008_create_sender_trust_plane.sql migrations/008_create_sender_ids.sql
          git mv migrations/031_create_domains.sql .domain-migration.tmp

          for number in $(seq 30 -1 9); do
            old_prefix=$(printf '%03d' "$number")
            new_prefix=$(printf '%03d' "$((number + 1))")
            file=$(find migrations -maxdepth 1 -type f -name "${old_prefix}_*.sql" -print -quit)
            test -n "$file"
            base=$(basename "$file")
            suffix=${base#${old_prefix}_}
            git mv "$file" "migrations/${new_prefix}_${suffix}"
          done

          git mv .domain-migration.tmp migrations/009_create_domains.sql

      - name: Move domain dependencies into their creation migrations
        shell: python
        run: |
          from pathlib import Path

          sender_ids = Path("migrations/008_create_sender_ids.sql")
          text = sender_ids.read_text()
          text = text.replace(
              "-- Establish the canonical sender trust plane before message tables are created.\n",
              "-- Create the canonical sender ID trust infrastructure before message tables.\n",
              1,
          )
          sender_ids.write_text(text)

          domains = Path("migrations/009_create_domains.sql")
          text = domains.read_text()
          marker = "-- Email messages now reference the domain aggregate directly."
          if marker not in text:
              raise SystemExit("domain integration marker not found")
          domains.write_text(text.split(marker, 1)[0].rstrip() + "\n")

          email_messages = Path("migrations/013_create_email_messages.sql")
          text = email_messages.read_text()
          old_column = "sender_provider_binding_id UUID REFERENCES sender_provider_bindings(id) ON DELETE SET NULL,"
          new_column = "sender_domain_id UUID REFERENCES domains(id) ON DELETE SET NULL,"
          if old_column not in text:
              raise SystemExit("email sender binding column not found")
          text = text.replace(old_column, new_column, 1)
          text = text.replace(
              "idx_email_messages_sender_provider_binding",
              "idx_email_messages_sender_domain",
          )
          text = text.replace(
              "ON email_messages (sender_provider_binding_id)",
              "ON email_messages (sender_domain_id)",
          )
          text = text.replace(
              "WHERE sender_provider_binding_id IS NOT NULL",
              "WHERE sender_domain_id IS NOT NULL",
          )
          if "sender_provider_binding_id" in text:
              raise SystemExit("legacy email sender binding reference remains")
          email_messages.write_text(text)

          tenant_invariants = Path("migrations/015_enforce_tenant_invariants.sql")
          text = tenant_invariants.read_text()
          start = text.index("CREATE OR REPLACE FUNCTION enforce_email_sender_binding()")
          end = text.index("CREATE OR REPLACE FUNCTION enforce_webhook_delivery_team()")
          domain_route = """CREATE OR REPLACE FUNCTION enforce_email_sender_domain()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              IF NEW.sender_domain_id IS NULL THEN
                  RETURN NEW;
              END IF;

              IF NOT EXISTS (
                  SELECT 1
                  FROM domains AS domain_record
                  WHERE domain_record.id = NEW.sender_domain_id
                    AND domain_record.team_id = NEW.team_id
                    AND domain_record.provider = lower(trim(NEW.delivery_provider))
                    AND domain_record.provider_region = lower(trim(NEW.provider_region))
              ) THEN
                  RAISE EXCEPTION 'email sender domain does not belong to this team and route'
                      USING ERRCODE = '23514';
              END IF;

              RETURN NEW;
          END;
          $$;

          DROP TRIGGER IF EXISTS trg_enforce_email_sender_domain ON email_messages;
          CREATE TRIGGER trg_enforce_email_sender_domain
          BEFORE INSERT OR UPDATE OF team_id, sender_domain_id, delivery_provider, provider_region ON email_messages
          FOR EACH ROW
          EXECUTE FUNCTION enforce_email_sender_domain();

          """
          tenant_invariants.write_text(text[:start] + domain_route + text[end:])

          customer_routes = Path("migrations/024_enforce_customer_email_tenant_routes.sql")
          customer_routes.write_text("""CREATE OR REPLACE FUNCTION enforce_email_sender_domain()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
              IF NEW.sender_domain_id IS NULL THEN
                  RAISE EXCEPTION 'customer sender domain is required'
                      USING ERRCODE = '23514';
              END IF;

              IF NOT EXISTS (
                  SELECT 1
                  FROM domains AS domain_record
                  WHERE domain_record.id = NEW.sender_domain_id
                    AND domain_record.team_id = NEW.team_id
                    AND domain_record.provider = lower(trim(NEW.delivery_provider))
                    AND domain_record.provider_region = lower(trim(NEW.provider_region))
                    AND domain_record.status = 'verified'
                    AND domain_record.sending_enabled
                    AND domain_record.disabled_at IS NULL
                    AND domain_record.health_status <> 'degraded'
              ) THEN
                  RAISE EXCEPTION 'customer sender domain is not verified, enabled, and healthy'
                      USING ERRCODE = '23514';
              END IF;

              PERFORM 1
              FROM email_tenants
              WHERE team_id = NEW.team_id
                AND provider = lower(trim(NEW.delivery_provider))
                AND region = lower(trim(NEW.provider_region))
                AND status = 'active';

              IF NOT FOUND THEN
                  RAISE EXCEPTION 'active customer email tenant is required'
                      USING ERRCODE = '23514';
              END IF;

              RETURN NEW;
          END;
          $$;

          DROP TRIGGER IF EXISTS trg_enforce_email_sender_domain ON email_messages;

          CREATE TRIGGER trg_enforce_email_sender_domain
          BEFORE INSERT OR UPDATE OF team_id, sender_domain_id, delivery_provider, provider_region
          ON email_messages
          FOR EACH ROW
          EXECUTE FUNCTION enforce_email_sender_domain();
          """)

          attempts = Path("migrations/025_create_message_delivery_attempts.sql")
          text = attempts.read_text()
          text = text.replace(
              "-- Create the channel-neutral provider-attempt ledger. Sender trust-plane tables\n-- are created earlier so message records and attempts can reference canonical\n-- sender assets and provider bindings from the beginning.\n",
              "-- Create the channel-neutral provider-attempt ledger. Domains and sender ID\n-- infrastructure are created earlier so attempts can reference the correct\n-- channel-specific sender identity.\n",
              1,
          )
          needle = "    provider_status TEXT,\n    sender_asset_id UUID REFERENCES sender_assets(id) ON DELETE SET NULL,"
          replacement = "    provider_status TEXT,\n    sender_domain_id UUID REFERENCES domains(id) ON DELETE SET NULL,\n    sender_asset_id UUID REFERENCES sender_assets(id) ON DELETE SET NULL,"
          if needle not in text:
              raise SystemExit("delivery attempt sender columns not found")
          text = text.replace(needle, replacement, 1)
          index = """CREATE INDEX IF NOT EXISTS idx_message_delivery_attempts_sender_domain
              ON message_delivery_attempts (sender_domain_id)
              WHERE sender_domain_id IS NOT NULL;

          """
          marker = "ALTER TABLE email_messages\n"
          if marker not in text:
              raise SystemExit("delivery attempt email constraint marker not found")
          text = text.replace(marker, index + marker, 1)
          attempts.write_text(text)

      - name: Verify migration ordering
        shell: bash
        run: |
          set -euo pipefail
          test -f migrations/008_create_sender_ids.sql
          test -f migrations/009_create_domains.sql
          test -f migrations/010_create_sms_messages.sql
          test -f migrations/013_create_email_messages.sql
          test -f migrations/025_create_message_delivery_attempts.sql
          test -f migrations/031_create_broadcasts.sql
          test ! -e migrations/008_create_sender_trust_plane.sql
          test ! -e migrations/031_create_domains.sql
          test "$(find migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' | wc -l)" -eq 31

      - name: Regenerate database artifacts
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          docker run --rm \
            -v "$PWD/migrations:/migrations" \
            arigaio/atlas:0.35.0 \
            migrate hash --dir file:///migrations

      - name: Run focused tests
        run: go test ./internal/modules/domain ./internal/modules/email ./internal/delivery/email/outbound

      - name: Commit renumbering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/renumber-domain-migrations.yml
          git add -A
          git commit -m "Renumber domain migrations"
          git push origin HEAD:agent/create-domains-aggregate
