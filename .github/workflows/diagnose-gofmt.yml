name: Diagnose Go formatting

on:
  push:
    branches:
      - feat/messaging-trust-delivery-attempts
    paths:
      - ".github/workflows/diagnose-gofmt.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/messaging-trust-delivery-attempts

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Capture unformatted files
        run: |
          gofmt -l . | sort > .gofmt-list.txt
          cat .gofmt-list.txt

      - name: Commit diagnostic list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gofmt-list.txt
          git commit -m "chore: capture unformatted Go files"
          git push origin HEAD:feat/messaging-trust-delivery-attempts
