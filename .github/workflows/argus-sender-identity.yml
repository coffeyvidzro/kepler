name: Argus Sender Identity

on:
  push:
    branches:
      - "fix/argus-sender-identity"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/argus-sender-identity
      - name: Configure Argus sender identities
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "internal/config/config.go",
              '''type ArgusConfig struct {
          \tHMACSecret string `env:"HMAC_SECRET"`
          }
          ''',
              '''type ArgusConfig struct {
          \tHMACSecret string `env:"HMAC_SECRET"`
          \tSenderID   string `env:"SENDER_ID" envDefault:"Dugble"`
          \tFromEmail  string `env:"FROM_EMAIL" envDefault:"argus@dugble.com"`
          }
          ''',
          )
          replace_once(
              "internal/config/config.go",
              '''\tc.Argus.HMACSecret = strings.TrimSpace(c.Argus.HMACSecret)
          ''',
              '''\tc.Argus.HMACSecret = strings.TrimSpace(c.Argus.HMACSecret)
          \tc.Argus.SenderID = strings.TrimSpace(c.Argus.SenderID)
          \tc.Argus.FromEmail = strings.ToLower(strings.TrimSpace(c.Argus.FromEmail))
          ''',
          )
          replace_once(
              "internal/dugble/worker/wire.go",
              '''\t\temailmodule.ServiceConfig{
          \t\t\tDefaultFromEmail: cfg.AWS.FromEmail,
          \t\t\tDefaultProvider:  "ses",
          \t\t\tDefaultRegion:    cfg.AWS.Region,
          \t\t},
          ''',
              '''\t\temailmodule.ServiceConfig{
          \t\t\tDefaultFromEmail: cfg.Argus.FromEmail,
          \t\t\tDefaultFromName:  "Dugble",
          \t\t\tDefaultProvider:  "ses",
          \t\t\tDefaultRegion:    cfg.AWS.Region,
          \t\t},
          ''',
          )
          replace_once(
              "internal/dugble/worker/wire.go",
              '''\t\targusdispatch.NewSMSChannel(smsAPIService, "Dugble"),
          ''',
              '''\t\targusdispatch.NewSMSChannel(smsAPIService, cfg.Argus.SenderID),
          ''',
          )
          replace_once(
              ".env.example",
              '''ARGUS_HMAC_SECRET=replace-with-a-separate-random-secret-at-least-32-characters
          ''',
              '''ARGUS_HMAC_SECRET=replace-with-a-separate-random-secret-at-least-32-characters
          ARGUS_SENDER_ID=Dugble
          ARGUS_FROM_EMAIL=argus@dugble.com
          ''',
          )
          replace_once(
              "deploy/compose.yaml",
              '''  ARGUS_HMAC_SECRET: ${ARGUS_HMAC_SECRET:?set ARGUS_HMAC_SECRET}
          ''',
              '''  ARGUS_HMAC_SECRET: ${ARGUS_HMAC_SECRET:?set ARGUS_HMAC_SECRET}
            ARGUS_SENDER_ID: ${ARGUS_SENDER_ID:-Dugble}
            ARGUS_FROM_EMAIL: ${ARGUS_FROM_EMAIL:-argus@dugble.com}
          ''',
          )
          PY
          gofmt -w internal/config/config.go internal/dugble/worker/wire.go
      - name: Commit changes
        run: |
          rm -f .github/workflows/argus-sender-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A internal/config/config.go internal/dugble/worker/wire.go .env.example deploy/compose.yaml .github/workflows/argus-sender-identity.yml
          git diff --cached --quiet && exit 0
          git commit -m "configure Argus sender identities"
          git push origin HEAD:fix/argus-sender-identity
