name: Validate messaging foundation

on:
  push:
    branches:
      - feat/messaging-trust-delivery-attempts
    paths:
      - ".github/workflows/validate-messaging-foundation.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/messaging-trust-delivery-attempts

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Vet messaging foundation
        run: go vet ./internal/platform/messaging/...

      - name: Test messaging foundation with race detector
        run: go test -race ./internal/platform/messaging/...

      - name: Record validation success
        run: |
          printf 'go vet ./internal/platform/messaging/...\ngo test -race ./internal/platform/messaging/...\n' > .messaging-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .messaging-validation.txt
          git commit -m "chore: record messaging validation success"
          git push origin HEAD:feat/messaging-trust-delivery-attempts
