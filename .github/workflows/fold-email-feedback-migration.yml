name: Fold email feedback migration

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fold:
    if: github.head_ref == 'feat/messaging-unified-feedback-processing' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/messaging-unified-feedback-processing
          fetch-depth: 0

      - name: Fold aggregate statuses into migration 012
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('migrations/012_create_email_messages.sql')
          text = migration.read_text()
          old = """        'delivered', 'delayed', 'bounced', 'complained', 'rejected',
        'failed', 'canceled'
"""
          new = """        'delivered', 'partially_delivered', 'delayed', 'partially_failed',
        'bounced', 'complained', 'rejected', 'failed', 'canceled'
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one email status constraint block, found {text.count(old)}')
          migration.write_text(text.replace(old, new, 1))

          extension = Path('migrations/026_extend_email_feedback_statuses.sql')
          if not extension.exists():
              raise SystemExit('migration 026 is missing before fold')
          extension.unlink()
          PY

      - name: Regenerate and validate Atlas checksums
        run: |
          docker run --rm -v "$PWD/migrations:/migrations" arigaio/atlas:1.3.0 migrate hash --dir file:///migrations
          docker run --rm -v "$PWD/migrations:/migrations" arigaio/atlas:1.3.0 migrate validate --dir file:///migrations

      - name: Verify folded migration
        run: |
          test ! -e migrations/026_extend_email_feedback_statuses.sql
          grep -q "'partially_delivered'" migrations/012_create_email_messages.sql
          grep -q "'partially_failed'" migrations/012_create_email_messages.sql
          ! grep -q "026_extend_email_feedback_statuses.sql" migrations/atlas.sum
          git diff --check

      - name: Commit folded migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/012_create_email_messages.sql migrations/026_extend_email_feedback_statuses.sql migrations/atlas.sum
          test -n "$(git status --porcelain)"
          git commit -m "chore: fold email feedback statuses into base migration"
          git push origin HEAD:feat/messaging-unified-feedback-processing
