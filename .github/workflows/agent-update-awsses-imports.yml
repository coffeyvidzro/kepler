name: Agent update AWS SES imports

on:
  push:
    branches:
      - agent/consolidate-email-tenant

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-email-tenant
          fetch-depth: 0

      - name: Update imports and remove compatibility packages
        shell: bash
        run: |
          set -euo pipefail

          old_email='github.com/coffeyvidzro/dugble/server/internal/platform/email'
          new_email='github.com/coffeyvidzro/dugble/server/internal/platform/awsses'
          old_tenant='github.com/coffeyvidzro/dugble/server/internal/delivery/email/tenant'
          new_tenant='github.com/coffeyvidzro/dugble/server/internal/modules/emailtenant/provisioning'

          while IFS= read -r -d '' file; do
            sed -i "s#${old_email}#${new_email}#g" "$file"
          done < <(git grep -lz "$old_email" -- '*.go' || true)

          while IFS= read -r -d '' file; do
            sed -i "s#${old_tenant}#${new_tenant}#g" "$file"
          done < <(git grep -lz "$old_tenant" -- '*.go' || true)

          rm -f internal/platform/email/compat.go
          rm -f internal/delivery/email/tenant/compat.go

          git diff --name-only --diff-filter=ACM -- '*.go' | xargs -r gofmt -w

          if git grep -n "$old_email" -- '*.go'; then
            echo 'stale platform/email import remains' >&2
            exit 1
          fi
          if git grep -n "$old_tenant" -- '*.go'; then
            echo 'stale delivery/email/tenant import remains' >&2
            exit 1
          fi

          rm -f .github/workflows/agent-update-awsses-imports.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update AWS SES and tenant provisioning imports'
          git push origin HEAD:agent/consolidate-email-tenant
