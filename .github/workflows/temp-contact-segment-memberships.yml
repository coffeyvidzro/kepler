name: Temporary Contact Segment Memberships

on:
  push:
    branches:
      - feat/contact-segment-memberships
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contact-segment-memberships-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/contact-segment-memberships
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply implementation
        run: python3 scripts/apply_contact_segment_memberships.py

      - name: Format
        run: gofmt -w internal/modules/contact internal/transport/http/contact internal/integration/messaging/contact_segment_memberships_test.go

      - name: Test
        run: go test ./...

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-contact-segment-memberships.yml scripts/apply_contact_segment_memberships.py
          git add internal/modules/contact internal/transport/http/contact internal/integration/messaging/contact_segment_memberships_test.go
          git commit -m "Add contact segment membership APIs"
          git push origin HEAD:feat/contact-segment-memberships
