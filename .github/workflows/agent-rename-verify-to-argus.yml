name: Agent rename Verify to Argus

on:
  push:
    branches: [agent/rename-verify-to-argus]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rename-verify-to-argus
          fetch-depth: 0

      - name: Rename Dugble Verify to Dugble Argus
        shell: bash
        run: |
          set -euo pipefail

          git mv internal/modules/verify internal/modules/argus
          git mv internal/transport/http/verify internal/transport/http/argus
          git mv internal/delivery/verify internal/delivery/argus
          git mv internal/platform/monitoring/verifymetrics internal/platform/monitoring/argusmetrics

          python3 <<'PY'
          from pathlib import Path
          import re

          replacements = [
              ('github.com/coffeyvidzro/dugble/server/internal/modules/verify', 'github.com/coffeyvidzro/dugble/server/internal/modules/argus'),
              ('github.com/coffeyvidzro/dugble/server/internal/transport/http/verify', 'github.com/coffeyvidzro/dugble/server/internal/transport/http/argus'),
              ('github.com/coffeyvidzro/dugble/server/internal/delivery/verify', 'github.com/coffeyvidzro/dugble/server/internal/delivery/argus'),
              ('github.com/coffeyvidzro/dugble/server/internal/platform/monitoring/verifymetrics', 'github.com/coffeyvidzro/dugble/server/internal/platform/monitoring/argusmetrics'),
              ('verifymodule', 'argusmodule'),
              ('verifyhttp', 'argushttp'),
              ('verifydispatch', 'argusdispatch'),
              ('verifycleanup', 'arguscleanup'),
              ('verifyexpiry', 'argusexpiry'),
              ('verifymetrics', 'argusmetrics'),
              ('VerifyConfig', 'ArgusConfig'),
              ('cfg.Verify', 'cfg.Argus'),
              ('c.Verify', 'c.Argus'),
              ('envPrefix:"VERIFY_"', 'envPrefix:"ARGUS_"'),
              ('VERIFY_HMAC_SECRET', 'ARGUS_HMAC_SECRET'),
              ('Dugble Verify', 'Dugble Argus'),
              ('dugble_verify_', 'dugble_argus_'),
              ('Verify operations', 'Argus operations'),
              ('verify metrics are not configured', 'Argus metrics are not configured'),
          ]

          suffixes = {'.go', '.md', '.yaml', '.yml', '.json', '.toml', '.env', '.txt', '.html', '.sql', '.sh'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix not in suffixes and path.name != '.env.example':
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text)

          for directory in ('internal/modules/argus', 'internal/transport/http/argus'):
              for path in Path(directory).rglob('*.go'):
                  path.write_text(re.sub(r'^package verify$', 'package argus', path.read_text(), count=1, flags=re.MULTILINE))

          metrics = Path('internal/platform/monitoring/argusmetrics/metrics.go')
          metrics.write_text(re.sub(r'^package verifymetrics$', 'package argusmetrics', metrics.read_text(), count=1, flags=re.MULTILINE))

          config = Path('internal/config/config.go')
          config.write_text(re.sub(
              r'\bVerify\s+ArgusConfig\s+`envPrefix:"ARGUS_"`',
              'Argus          ArgusConfig   `envPrefix:"ARGUS_"`',
              config.read_text(),
              count=1,
          ))

          for path in (Path('internal/dugble/server/wire.go'), Path('internal/dugble/worker/wire.go')):
              path.write_text(re.sub(r'\bverify([A-Z][A-Za-z0-9_]*)', r'argus\1', path.read_text()))

          generic_verbs = {
              Path('internal/modules/auth/repository.go'): [('ArgusEmailWithToken', 'VerifyEmailWithToken')],
              Path('internal/modules/mfa/repository.go'): [('ArgusTOTPAndElevateSession', 'VerifyTOTPAndElevateSession')],
          }
          for path, values in generic_verbs.items():
              text = path.read_text()
              for old, new in values:
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          git diff --name-only --diff-filter=ACM -- '*.go' | xargs -r gofmt -w

          test ! -e internal/modules/verify
          test ! -e internal/transport/http/verify
          test ! -e internal/delivery/verify
          test ! -e internal/platform/monitoring/verifymetrics

          if git grep -nE 'internal/(modules|transport/http|delivery)/verify|internal/platform/monitoring/verifymetrics' -- '*.go' '*.md' ':!.github/**'; then
            echo 'legacy Verify package path remains' >&2
            exit 1
          fi
          if git grep -nE '\b(verifymodule|verifyhttp|verifydispatch|verifycleanup|verifyexpiry|verifymetrics)\b' -- '*.go'; then
            echo 'legacy Verify package alias remains' >&2
            exit 1
          fi
          if git grep -nE '^package verify$' -- internal/modules/argus internal/transport/http/argus; then
            echo 'legacy Verify package declaration remains' >&2
            exit 1
          fi
          if git grep -nE '\bVerifyConfig\b|cfg\.Verify\b|c\.Verify\b|VERIFY_HMAC_SECRET|envPrefix:"VERIFY_"' -- '*.go' '*.md' '.env*' ':!.github/**'; then
            echo 'legacy Verify configuration branding remains' >&2
            exit 1
          fi

          go test ./...

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            rm -f .github/workflows/agent-rename-verify-to-argus.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Rename Dugble Verify to Dugble Argus'
            git push origin HEAD:agent/rename-verify-to-argus
          fi
