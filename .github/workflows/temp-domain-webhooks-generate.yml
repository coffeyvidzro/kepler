name: Temporary Domain Webhooks Generate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/domain-webhooks
    paths:
      - "internal/platform/event/**"
      - "internal/platform/webhook/**"
      - "internal/modules/contact/**"
      - "internal/modules/suppression/**"
      - "internal/modules/broadcast/**"
      - "internal/database/queries/**"
      - "sqlc.yaml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/domain-webhooks
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format Go
        run: gofmt -w internal/platform/event internal/platform/webhook internal/modules/contact internal/modules/suppression internal/modules/broadcast

      - name: Generate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Test
        run: go test ./...

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/platform/event internal/platform/webhook internal/modules/contact internal/modules/suppression internal/modules/broadcast internal/database/sqlc
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate and format domain webhooks"
          git push origin HEAD:feat/domain-webhooks
