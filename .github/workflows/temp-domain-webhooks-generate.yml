name: Temporary Domain Webhooks Generate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/domain-webhooks
    paths:
      - ".github/workflows/temp-domain-webhooks-generate.yml"
      - "internal/platform/event/**"
      - "internal/platform/webhook/**"
      - "internal/modules/contact/**"
      - "internal/modules/suppression/**"
      - "internal/modules/broadcast/**"
      - "internal/dugble/server/wire.go"
      - "internal/database/queries/**"
      - "sqlc.yaml"

permissions:
  contents: write

concurrency:
  group: temp-domain-webhooks-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/domain-webhooks
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format Go
        shell: bash
        run: |
          mapfile -d '' files < <(
            find \
              internal/platform/event \
              internal/platform/webhook \
              internal/modules/contact \
              internal/modules/suppression \
              internal/modules/broadcast \
              -type f -name '*.go' -print0
          )
          files+=(internal/dugble/server/wire.go)
          gofmt -w "${files[@]}"

      - name: Generate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Test
        run: go test ./...

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/platform/event \
            internal/platform/webhook \
            internal/modules/contact \
            internal/modules/suppression \
            internal/modules/broadcast \
            internal/dugble/server/wire.go \
            internal/database/sqlc
          if git diff --cached --quiet; then
            echo "No generated or formatted changes to commit."
            exit 0
          fi
          git commit -m "Generate and format domain webhooks"
          git push origin HEAD:feat/domain-webhooks
