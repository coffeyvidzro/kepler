name: Renumber migrations

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/renumber-migrations.yml"

permissions:
  contents: write

jobs:
  renumber:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Renumber migrations contiguously
        run: |
          set -euo pipefail
          git mv migrations/010_create_sms_messages.sql migrations/009_create_sms_messages.sql
          git mv migrations/011_create_idempotency_keys.sql migrations/010_create_idempotency_keys.sql
          git mv migrations/012_create_outbox.sql migrations/011_create_outbox.sql
          git mv migrations/013_create_email_messages.sql migrations/012_create_email_messages.sql
          git mv migrations/014_create_webhooks.sql migrations/013_create_webhooks.sql
          git mv migrations/015_enforce_tenant_invariants.sql migrations/014_enforce_tenant_invariants.sql
          git mv migrations/016_create_audit_events.sql migrations/015_create_audit_events.sql
          git mv migrations/017_create_billing_foundation.sql migrations/016_create_billing_foundation.sql
          git mv migrations/018_create_sms_rates.sql migrations/017_create_sms_rates.sql
          git mv migrations/019_create_product_rates.sql migrations/018_create_product_rates.sql
          git mv migrations/020_create_usage_allowance.sql migrations/019_create_usage_allowance.sql
          git mv migrations/021_create_email_provider_events.sql migrations/020_create_email_provider_events.sql
          git mv migrations/023_create_email_recipients.sql migrations/021_create_email_recipients.sql
          git mv migrations/024_create_email_tenants.sql migrations/022_create_email_tenants.sql
          git mv migrations/025_enforce_customer_email_tenant_routes.sql migrations/023_enforce_customer_email_tenant_routes.sql
          git mv migrations/026_create_verify.sql migrations/024_create_verify.sql
          git mv migrations/028_create_message_delivery_attempts.sql migrations/025_create_message_delivery_attempts.sql

      - name: Regenerate and validate Atlas checksums
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/migrations:/migrations" arigaio/atlas:1.3.0 migrate hash --dir file:///migrations
          docker run --rm -v "$PWD/migrations:/migrations" arigaio/atlas:1.3.0 migrate validate --dir file:///migrations

          mapfile -t files < <(find migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort)
          test "${#files[@]}" -eq 25
          for index in "${!files[@]}"; do
            expected=$(printf '%03d' "$((index + 1))")
            actual=${files[$index]%%_*}
            if [[ "$actual" != "$expected" ]]; then
              echo "expected migration $expected, found ${files[$index]}"
              exit 1
            fi
          done

      - name: Commit renumbered migration history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations
          git commit -m "chore: renumber migrations contiguously"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
