name: Renumber migrations

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  renumber:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/renumber-migrations
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Remove and renumber migrations
        shell: bash
        run: |
          set -euo pipefail

          test -f migrations/024_create_verify.sql
          test -f migrations/025_create_message_delivery_attempts.sql

          rm migrations/024_create_verify.sql
          mv migrations/025_create_message_delivery_attempts.sql migrations/024_create_message_delivery_attempts.sql
          rm .github/workflows/renumber-migrations.yml

          docker run --rm \
            -v "${PWD}/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          gofmt -w internal/database/sqlc

          test ! -e migrations/024_create_verify.sql
          test -f migrations/024_create_message_delivery_attempts.sql
          test ! -e migrations/025_create_message_delivery_attempts.sql

      - name: Validate regenerated state
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/migrations:/migrations:ro" \
            arigaio/atlas:1.3.0-alpine \
            migrate validate --dir file:///migrations
          go vet ./...
          go test ./...

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remove Argus migration and renumber migrations"
          git push origin HEAD:chore/renumber-migrations
