name: Fix Domain Staticcheck Adapters

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-domain-staticcheck.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-domain-staticcheck-adapters
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/create-domains-aggregate
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Replace struct adapters with conversions
        shell: python
        run: |
          from pathlib import Path
          import re

          claims = Path("internal/modules/domain/claims.go")
          text = claims.read_text()
          text, count = re.subn(
              r"func domainClaimFromPendingRow\(row dbsqlc\.ClaimPendingDomainClaimsRow\) DomainClaim \{[\s\S]*?\n\}\n\nfunc domainClaimFromSQLC",
              "func domainClaimFromPendingRow(row dbsqlc.ClaimPendingDomainClaimsRow) DomainClaim {\n\treturn domainClaimFromSQLC(dbsqlc.DomainClaim(row))\n}\n\nfunc domainClaimFromSQLC",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"claims adapter: expected one replacement, got {count}")
          claims.write_text(text)

          repository = Path("internal/modules/domain/repository.go")
          text = repository.read_text()
          text, count = re.subn(
              r"func domainFromReconciliationRow\(row dbsqlc\.ClaimPendingDomainReconciliationsRow\) dbsqlc\.Domain \{[\s\S]*?\n\}\n\nfunc domainFromSQLC",
              "func domainFromReconciliationRow(row dbsqlc.ClaimPendingDomainReconciliationsRow) dbsqlc.Domain {\n\treturn dbsqlc.Domain(row)\n}\n\nfunc domainFromSQLC",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"domain adapter: expected one replacement, got {count}")
          repository.write_text(text)

      - name: Format
        run: gofmt -w internal/modules/domain/claims.go internal/modules/domain/repository.go

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Verify lint and tests
        run: |
          golangci-lint config verify --config .golangci.yml
          golangci-lint run --config .golangci.yml ./...
          go test ./...

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-domain-staticcheck.yml
          git add -A
          git commit -m "Use direct sqlc row conversions"
          git push origin HEAD:agent/create-domains-aggregate
