name: Remove Argus API

on:
  push:
    branches:
      - remove/argus-api
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: remove/argus-api
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Remove Argus runtime and API
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            internal/modules/argus \
            internal/transport/http/argus \
            internal/delivery/argus \
            internal/platform/systemmail/templates/argus

          rm -f \
            internal/platform/systemmail/argus_templates.go \
            internal/modules/email/verification.go \
            internal/modules/sms/verification.go \
            internal/database/queries/verification*.sql \
            internal/database/sqlc/verification*.sql.go

          python3 <<'PY'
          from pathlib import Path
          import re

          def edit(path, transform):
              file = Path(path)
              original = file.read_text()
              updated = transform(original)
              if updated == original:
                  raise SystemExit(f"expected change was not applied to {path}")
              file.write_text(updated)

          def remove_exact(text, snippets, path):
              for snippet in snippets:
                  if snippet not in text:
                      raise SystemExit(f"missing expected snippet in {path}: {snippet!r}")
                  text = text.replace(snippet, "")
              return text

          edit("internal/config/config.go", lambda text: remove_exact(text, [
              '''type ArgusConfig struct {\n\tHMACSecret string `env:"HMAC_SECRET"`\n\tSenderID   string `env:"SENDER_ID" envDefault:"Dugble"`\n\tFromEmail  string `env:"FROM_EMAIL" envDefault:"argus@dugble.com"`\n}\n\n''',
              '''\tArgus          ArgusConfig    `envPrefix:"ARGUS_"`\n''',
              '''\tc.Argus.HMACSecret = strings.TrimSpace(c.Argus.HMACSecret)\n\tc.Argus.SenderID = strings.TrimSpace(c.Argus.SenderID)\n\tc.Argus.FromEmail = strings.ToLower(strings.TrimSpace(c.Argus.FromEmail))\n''',
          ], "internal/config/config.go"))

          def edit_server(text):
              return remove_exact(text, [
                  '''\targusdispatch "github.com/coffeyvidzro/dugble/server/internal/delivery/argus/dispatch"\n''',
                  '''\targusmodule "github.com/coffeyvidzro/dugble/server/internal/modules/argus"\n''',
                  '''\targushttp "github.com/coffeyvidzro/dugble/server/internal/transport/http/argus"\n''',
                  '''\n\targusSecret := []byte(cfg.Argus.HMACSecret)\n\targusCodes, err := argusmodule.NewCodeManager(argusSecret, mfaCipher)\n\tif err != nil {\n\t\treturn fail(fmt.Errorf("initialize verify code manager: %w", err))\n\t}\n\targusService := argusmodule.NewService(\n\t\targusmodule.NewRepository(db),\n\t\targusCodes,\n\t\targusdispatch.NewQueue(outboxRepository),\n\t\tproductRuntime.Events,\n\t)\n''',
                  '''\t\targushttp.RegisterRoutes(router, argushttp.NewHandler(argusService), tenantAccess)\n''',
              ], "internal/dugble/server/wire.go")

          edit("internal/dugble/server/wire.go", edit_server)

          def edit_worker(text):
              return remove_exact(text, [
                  '''\targuscleanup "github.com/coffeyvidzro/dugble/server/internal/delivery/argus/cleanup"\n''',
                  '''\targusdispatch "github.com/coffeyvidzro/dugble/server/internal/delivery/argus/dispatch"\n''',
                  '''\targusexpiry "github.com/coffeyvidzro/dugble/server/internal/delivery/argus/expiry"\n''',
                  '''\temailmodule "github.com/coffeyvidzro/dugble/server/internal/modules/email"\n''',
                  '''\t"github.com/coffeyvidzro/dugble/server/internal/platform/authnz"\n''',
                  '''\tplatformbilling "github.com/coffeyvidzro/dugble/server/internal/platform/billing"\n''',
                  '''\tplatformevent "github.com/coffeyvidzro/dugble/server/internal/platform/event"\n''',
                  '''\tevents := platformevent.NewEmitter(platformwebhook.NewEventSink(webhookEmitter))\n''',
                  '''\tbillingService := platformbilling.NewService(platformbilling.NewRepository(db))\n''',
                  '''\n\targusCipher, err := authnz.NewSecretCipherKeyring(cfg.EncryptionKeys)\n\tif err != nil {\n\t\treturn fail(fmt.Errorf("initialize verification code cipher: %w", err))\n\t}\n\temailAPIService := emailmodule.NewService(\n\t\temailmodule.NewRepository(db),\n\t\temaildelivery.NewQueue(outboxRepository),\n\t\temailmodule.ServiceConfig{\n\t\t\tDefaultFromEmail: cfg.Argus.FromEmail,\n\t\t\tDefaultFromName:  "Dugble",\n\t\t\tDefaultProvider:  "ses",\n\t\t\tDefaultRegion:    cfg.AWS.Region,\n\t\t},\n\t\tbillingService,\n\t)\n\tsmsAPIService := smsmodule.NewService(\n\t\tsmsRepository,\n\t\tsmsSender,\n\t\tsmsdelivery.NewQueue(outboxRepository),\n\t\tbillingService,\n\t)\n\targusProcessor := argusdispatch.NewProcessor(\n\t\targusdispatch.NewRepository(db),\n\t\targusCipher,\n\t\targusdispatch.NewEmailChannel(emailAPIService),\n\t\targusdispatch.NewSMSChannel(smsAPIService, cfg.Argus.SenderID),\n\t\tevents,\n\t)\n\targusConsumer := argusdispatch.NewConsumer(\n\t\tmessagingClient,\n\t\tprocessedEvents,\n\t\targusProcessor,\n\t\targusdispatch.DefaultConsumerConfig(),\n\t)\n\targusExpiryScanner := argusexpiry.NewScanner(\n\t\targusexpiry.NewProcessor(db, events),\n\t\targusexpiry.DefaultConfig(),\n\t)\n\targusCleanupWorker := arguscleanup.NewWorker(db, arguscleanup.DefaultConfig())\n''',
                  '''\t\tjob{name: "verification dispatch consumer", run: argusConsumer.Run},\n''',
                  '''\t\tjob{name: "verification expiry scanner", run: argusExpiryScanner.Run},\n''',
                  '''\t\tjob{name: "verification cleanup worker", run: argusCleanupWorker.Run},\n''',
              ], "internal/dugble/worker/wire.go")

          edit("internal/dugble/worker/wire.go", edit_worker)

          def edit_catalog(text):
              text, constants = re.subn(
                  r'\n\tTypeVerificationCreated[\s\S]*?\tTypeVerificationCanceled\s+Type = "verification\.canceled"\n',
                  '',
                  text,
                  count=1,
              )
              text, definitions = re.subn(
                  r'\n\t\{Type: TypeVerificationCreated,[\s\S]*?\t\{Type: TypeVerificationCanceled, ObjectType: "verification", ObjectIDRequired: true, Subscribable: true\},',
                  '',
                  text,
                  count=1,
              )
              if constants != 1 or definitions != 1:
                  raise SystemExit("verification event catalog blocks were not removed")
              return text

          edit("internal/platform/event/catalog.go", edit_catalog)

          edit(".env.example", lambda text: remove_exact(text, [
              "ARGUS_HMAC_SECRET=replace-with-a-separate-random-secret-at-least-32-characters\n",
              "ARGUS_SENDER_ID=Dugble\n",
              "ARGUS_FROM_EMAIL=argus@dugble.com\n",
          ], ".env.example"))

          edit("deploy/compose.yaml", lambda text: remove_exact(text, [
              "  ARGUS_HMAC_SECRET: ${ARGUS_HMAC_SECRET:?set ARGUS_HMAC_SECRET}\n",
              "  ARGUS_SENDER_ID: ${ARGUS_SENDER_ID:-Dugble}\n",
              "  ARGUS_FROM_EMAIL: ${ARGUS_FROM_EMAIL:-argus@dugble.com}\n",
          ], "deploy/compose.yaml"))
          PY

          rm -f .github/workflows/remove-argus-api.yml

          gofmt -w internal/config/config.go internal/dugble/server/wire.go internal/dugble/worker/wire.go internal/platform/event/catalog.go
          go mod tidy
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          gofmt -w internal/database/sqlc

          if grep -RInE 'Argus|ARGUS_|argus@dugble\.com|internal/.*/argus|dugble\.job\.verify|verification\.(created|dispatched|approved|incorrect|resent|expired|delivery_failed|max_attempts_reached|canceled)' \
            --exclude-dir=.git \
            --exclude='024_create_verify.sql' \
            .; then
            echo "Argus runtime references remain" >&2
            exit 1
          fi

      - name: Validate removal
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Commit removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remove Argus verification API"
          git push origin HEAD:remove/argus-api
