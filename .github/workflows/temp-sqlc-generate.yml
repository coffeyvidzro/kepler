name: Temporary SQLC Generate

on:
  push:
    branches:
      - feat/contacts-and-properties-schema
    paths:
      - "migrations/**"
      - "internal/database/queries/**"
      - "sqlc.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-sqlc-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate SQLC and migration hash
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/contacts-and-properties-schema
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Generate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      - name: Regenerate migration checksum
        run: atlas migrate hash --dir file://migrations

      - name: Commit generated files
        run: |
          if git diff --quiet -- internal/database/sqlc migrations/atlas.sum; then
            echo "Generated files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/database/sqlc migrations/atlas.sum
          git commit -m "Generate contact SQLC code"
          git push origin HEAD:feat/contacts-and-properties-schema
