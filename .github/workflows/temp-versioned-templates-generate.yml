name: Temporary Versioned Templates Generate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/versioned-templates
    paths:
      - "migrations/**"
      - "internal/database/queries/**"
      - "internal/modules/messagetemplate/**"
      - "internal/transport/http/messagetemplate/**"
      - "internal/dugble/server/**"
      - "internal/platform/tenant/**"
      - "sqlc.yaml"

permissions:
  contents: write

concurrency:
  group: temp-versioned-templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/versioned-templates
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Format Go
        run: gofmt -w internal/modules/messagetemplate internal/transport/http/messagetemplate internal/dugble/server internal/platform/tenant/template_permissions.go

      - name: Generate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      - name: Regenerate migration checksum
        run: atlas migrate hash --dir file://migrations

      - name: Test
        run: go test ./...

      - name: Commit generated and formatted files
        run: |
          if git diff --quiet; then
            echo "Files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/database/sqlc internal/modules/messagetemplate internal/transport/http/messagetemplate internal/dugble/server internal/platform/tenant/template_permissions.go migrations/atlas.sum
          git commit -m "Generate and format versioned templates"
          git push origin HEAD:feat/versioned-templates
