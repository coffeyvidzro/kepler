name: Temporary Persist Broadcast Worker Wiring

on:
  push:
    branches:
      - feat/broadcast-fanout
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-persist-broadcast-worker-wiring
  cancel-in-progress: true

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/broadcast-fanout
          fetch-depth: 0

      - name: Apply worker wiring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("internal/dugble/worker/wire.go")
          text = path.read_text()

          replacements = [
              (
                  '\tbroadcastmodule "github.com/coffeyvidzro/dugble/server/internal/modules/broadcast"\n\tdomainmodule "github.com/coffeyvidzro/dugble/server/internal/modules/domain"\n\t"github.com/coffeyvidzro/dugble/server/internal/modules/emailtenant"\n',
                  '\tbroadcastmodule "github.com/coffeyvidzro/dugble/server/internal/modules/broadcast"\n\tdomainmodule "github.com/coffeyvidzro/dugble/server/internal/modules/domain"\n\temailmodule "github.com/coffeyvidzro/dugble/server/internal/modules/email"\n\t"github.com/coffeyvidzro/dugble/server/internal/modules/emailtenant"\n\tmessagetemplatemodule "github.com/coffeyvidzro/dugble/server/internal/modules/messagetemplate"\n',
              ),
              (
                  '\tplatformevent "github.com/coffeyvidzro/dugble/server/internal/platform/event"\n\t"github.com/coffeyvidzro/dugble/server/internal/platform/outbox"\n',
                  '\tplatformbilling "github.com/coffeyvidzro/dugble/server/internal/platform/billing"\n\tplatformevent "github.com/coffeyvidzro/dugble/server/internal/platform/event"\n\t"github.com/coffeyvidzro/dugble/server/internal/platform/outbox"\n',
              ),
              (
                  '''\tlifecycleEmitter := webhookEmitter
\tbroadcastExecutionRepository := broadcastmodule.NewRepositoryWithEventEmitter(
\t\tdb,
\t\tplatformevent.NewEmitter(platformwebhook.NewEventSink(webhookEmitter)),
\t)
\tbroadcastExecutionConsumer := broadcastexecution.NewConsumer(
\t\tbroadcastexecution.NewProcessor(broadcastExecutionRepository),
\t\tbroadcastexecution.Config{
\t\t\tPollInterval: time.Second,
\t\t\tBatchSize:    100,
\t\t},
\t)
''',
                  '''\tlifecycleEmitter := webhookEmitter
\tbroadcastBillingService := platformbilling.NewService(platformbilling.NewRepository(db))
\tbroadcastEmailRepository := emailmodule.NewRepository(db)
\tbroadcastEmailService := emailmodule.NewService(
\t\tbroadcastEmailRepository,
\t\temaildelivery.NewQueue(outboxRepository),
\t\temailmodule.ServiceConfig{
\t\t\tDefaultFromEmail: cfg.AWS.FromEmail,
\t\t\tDefaultProvider:  domainmodule.DefaultProvider,
\t\t\tDefaultRegion:    cfg.AWS.Region,
\t\t},
\t\tbroadcastBillingService,
\t)
\tbroadcastTemplateService := messagetemplatemodule.NewService(
\t\tmessagetemplatemodule.NewRepository(db),
\t\tbroadcastEmailService,
\t)
\tbroadcastExecutionRepository := broadcastmodule.NewRepositoryWithEventEmitter(
\t\tdb,
\t\tplatformevent.NewEmitter(platformwebhook.NewEventSink(webhookEmitter)),
\t)
\tbroadcastExecutionConsumer := broadcastexecution.NewConsumer(
\t\tbroadcastexecution.NewProcessor(
\t\t\tbroadcastExecutionRepository,
\t\t\tbroadcastTemplateService,
\t\t\tbroadcastEmailService,
\t\t),
\t\tbroadcastexecution.Config{
\t\t\tPollInterval: time.Second,
\t\t\tBatchSize:    100,
\t\t},
\t)
''',
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit("worker wiring anchor not found")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          gofmt -w internal/dugble/worker/wire.go

      - name: Commit worker wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/dugble/worker/wire.go
          if git diff --cached --quiet; then
            echo "Worker wiring already persisted."
            exit 0
          fi
          git commit -m "Wire broadcast fanout dependencies in worker"
          git push origin HEAD:feat/broadcast-fanout
