name: Temporary Broadcast Recipients Validate

on:
  push:
    branches:
      - feat/broadcast-recipients
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-broadcast-recipients-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/broadcast-recipients
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Atlas
        uses: ariga/setup-atlas@v0

      - name: Generate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Hash migrations
        run: atlas migrate hash --dir file://migrations

      - name: Format Go
        shell: bash
        run: |
          mapfile -d '' files < <(
            find internal/modules/broadcast internal/delivery/broadcast internal/dugble/worker \
              -type f -name '*.go' -print0
          )
          gofmt -w "${files[@]}"

      - name: Verify broadcast structure
        shell: bash
        run: |
          mapfile -t files < <(find internal/modules/broadcast -maxdepth 1 -type f -name '*.go' -printf '%f\n' | sort)
          expected=(model.go repository.go service.go validation.go)
          if [[ "${files[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected broadcast module files: %s\n' "${files[*]}"
            exit 1
          fi
          test ! -e internal/dugble/worker/broadcast_execution.go

      - name: Test
        run: go test ./...

      - name: Commit generated changes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A internal/database/sqlc internal/modules/broadcast internal/delivery/broadcast internal/dugble/worker migrations/atlas.sum
          if git diff --cached --quiet; then
            echo "No generated or formatted changes to commit."
            exit 0
          fi
          git commit -m "Generate SQLC for broadcast recipient materialization"
          git push origin HEAD:feat/broadcast-recipients
