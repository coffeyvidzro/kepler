name: Validate migration history rewrite

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-migration-rewrite.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Regenerate Atlas checksum
        run: |
          docker run --rm \
            -v "${PWD}/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Validate migration history
        run: |
          docker run --rm \
            -v "${PWD}/migrations:/migrations:ro" \
            arigaio/atlas:1.3.0-alpine \
            migrate validate --dir file:///migrations

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Regenerate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- migrations/atlas.sum internal/database/sqlc; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/atlas.sum internal/database/sqlc
          git commit -m "chore: regenerate migration and SQLC artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
