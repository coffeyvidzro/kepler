name: Fix migration compatibility view types

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-migration-view-types.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Tighten compatibility view projections
        shell: python
        run: |
          from pathlib import Path

          path = Path("migrations/008_create_sender_trust_plane.sql")
          sql = path.read_text()
          zero_uuid = "'00000000-0000-0000-0000-000000000000'::uuid"

          sql = sql.replace(
              "    asset.team_id,\n    asset.identity::VARCHAR(11) AS name,",
              f"    COALESCE(asset.team_id, {zero_uuid}) AS team_id,\n    asset.identity::VARCHAR(11) AS name,",
              1,
          )
          sql = sql.replace(
              "    END AS status,\n    binding.provider,",
              "    END::TEXT AS status,\n    binding.provider,",
              1,
          )
          sql = sql.replace(
              "WHERE asset.channel = 'sms';",
              "WHERE asset.channel = 'sms'\n  AND asset.owner_type = 'team'\n  AND asset.team_id IS NOT NULL;",
              1,
          )

          sql = sql.replace(
              "    asset.team_id,\n    asset.normalized_identity AS domain,",
              f"    COALESCE(asset.team_id, {zero_uuid}) AS team_id,\n    asset.normalized_identity AS domain,",
              1,
          )
          sql = sql.replace(
              "    CASE binding.provider WHEN 'ses' THEN 'aws_ses' ELSE binding.provider END AS provider,",
              "    CASE binding.provider WHEN 'ses' THEN 'aws_ses' ELSE binding.provider END::TEXT AS provider,",
              1,
          )
          sql = sql.replace(
              "    END AS status,\n    COALESCE(binding.verification_data -> 'records', '[]'::jsonb) AS verification_records,",
              "    END::TEXT AS status,\n    COALESCE(binding.verification_data -> 'records', '[]'::jsonb)::JSONB AS verification_records,",
              1,
          )
          sql = sql.replace(
              "WHERE asset.channel = 'email';",
              "WHERE asset.channel = 'email'\n  AND asset.owner_type = 'team'\n  AND asset.team_id IS NOT NULL;",
              1,
          )

          path.write_text(sql)

      - name: Regenerate and validate Atlas checksum
        run: |
          docker run --rm \
            -v "${PWD}/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations
          docker run --rm \
            -v "${PWD}/migrations:/migrations:ro" \
            arigaio/atlas:1.3.0-alpine \
            migrate validate --dir file:///migrations

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Regenerate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/008_create_sender_trust_plane.sql migrations/atlas.sum internal/database/sqlc
          git commit -m "fix: preserve compatibility view SQL types"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
