name: Apply email attempt cutover

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-email-attempt-cutover.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply cutover
        run: python .github/scripts/cutover_email_delivery_attempts.py

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Format, regenerate, and validate
        run: |
          gofmt -w \
            internal/delivery/email/outbound/repository.go \
            internal/delivery/email/outbound/recovery.go \
            internal/delivery/email/feedback/repository.go
          docker run --rm -v "$PWD/migrations:/migrations" arigaio/atlas:1.3.0 migrate hash --dir file:///migrations
          docker run --rm -v "$PWD/migrations:/migrations" arigaio/atlas:1.3.0 migrate validate --dir file:///migrations
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          if grep -R "email_delivery_attempts" migrations internal --exclude='atlas.sum'; then
            echo "legacy email delivery attempt references remain"
            exit 1
          fi
          go test -run '^$' ./...
          go vet ./internal/delivery/email/... ./internal/platform/messaging/...
          go test -race ./internal/delivery/email/... ./internal/platform/messaging/...
          test -z "$(gofmt -l .)"
          git diff --exit-code -- go.mod go.sum

      - name: Commit cutover
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "cutover already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify email delivery attempts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
