name: Patch email compile error

on:
  push:
    branches:
      - fix/email-attachments-metrics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/email-attachments-metrics
      - name: Patch and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/modules/email/content.go')
          text = path.read_text()
          old = 'strings.Replace(query, "lower(template.alias) = lower($2)", "template.id = $2")'
          new = 'strings.ReplaceAll(query, "lower(template.alias) = lower($2)", "template.id = $2")'
          if old not in text:
              raise SystemExit('target expression not found')
          path.write_text(text.replace(old, new))
          PY
          gofmt -w internal/modules/email/content.go
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/modules/email/content.go
          git commit -m "Fix published template query selection"
          git push origin HEAD:fix/email-attachments-metrics
