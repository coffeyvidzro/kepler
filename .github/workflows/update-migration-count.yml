name: Update migration count

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/renumber-migrations
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Update migration count and validate
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/len(migrationPaths) != 25/len(migrationPaths) != 24/' internal/integration/messaging/database_test.go
          sed -i 's/expected 25 migrations/expected 24 migrations/' internal/integration/messaging/database_test.go
          rm .github/workflows/update-migration-count.yml
          gofmt -w internal/integration/messaging/database_test.go
          go test ./internal/integration/messaging
          go vet ./...
          go test ./...

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "update canonical migration count"
          git push origin HEAD:chore/renumber-migrations
