name: Format repository baseline

on:
  push:
    branches:
      - feat/messaging-trust-delivery-attempts
    paths:
      - ".github/workflows/format-messaging.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/messaging-trust-delivery-attempts

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Format files reported by repository gate
        run: |
          gofmt -w \
            internal/delivery/email/outbound/processor.go \
            internal/delivery/email/outbound/recovery.go \
            internal/modules/emailtenant/provisioning/errors.go \
            internal/platform/senderid/validation.go \
            internal/platform/sms/routing/service.go

      - name: Commit formatting
        run: |
          if git diff --quiet -- '*.go'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/delivery/email/outbound/processor.go \
            internal/delivery/email/outbound/recovery.go \
            internal/modules/emailtenant/provisioning/errors.go \
            internal/platform/senderid/validation.go \
            internal/platform/sms/routing/service.go
          git commit -m "style: satisfy repository formatting gate"
          git push origin HEAD:feat/messaging-trust-delivery-attempts
