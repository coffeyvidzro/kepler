name: Format messaging foundation

on:
  push:
    branches:
      - feat/messaging-trust-delivery-attempts
    paths:
      - ".github/workflows/format-messaging.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/messaging-trust-delivery-attempts

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Format messaging packages
        run: gofmt -w internal/platform/messaging

      - name: Commit formatting
        run: |
          if git diff --quiet -- internal/platform/messaging; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/platform/messaging
          git commit -m "style: format messaging foundation"
          git push origin HEAD:feat/messaging-trust-delivery-attempts
