name: Implement unified messaging feedback

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'feat/messaging-unified-feedback-processing' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/messaging-unified-feedback-processing
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Apply unified feedback integration
        env:
          TRANSFORM_PAYLOAD: 
        run: |
          python - <<'PYCODE'
          import base64
          import os
          import zlib
          source = zlib.decompress(base64.b64decode(os.environ['TRANSFORM_PAYLOAD'])).decode()
          exec(compile(source, 'transform_feedback.py', 'exec'))
          PYCODE

      - name: Format changed Go files
        run: |
          gofmt -w \
            internal/platform/messaging/feedback \
            internal/platform/messaging/delivery/transition.go \
            internal/delivery/messaging/feedback \
            internal/delivery/email/feedback \
            internal/delivery/sms/feedback \
            internal/modules/sms/repository.go \
            internal/modules/sms/feedback_test.go \
            internal/dugble/worker/wire.go

      - name: Run focused race tests
        run: |
          go test -race \
            ./internal/platform/messaging/feedback \
            ./internal/platform/messaging/delivery \
            ./internal/delivery/messaging/feedback \
            ./internal/delivery/email/feedback \
            ./internal/delivery/sms/feedback \
            ./internal/modules/sms

      - name: Run vet
        run: go vet ./...

      - name: Compile every package and test binary
        run: go test -run '^$' ./...

      - name: Refresh migration checksums
        run: docker run --rm -v "$PWD/migrations:/migrations" arigaio/atlas:1.3.0 migrate hash --dir file:///migrations

      - name: Check diff
        run: git diff --check

      - name: Commit unified feedback processing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/platform/messaging/feedback \
            internal/platform/messaging/delivery/transition.go \
            internal/delivery/messaging/feedback \
            internal/delivery/email/feedback \
            internal/delivery/sms/feedback \
            internal/modules/sms/repository.go \
            internal/modules/sms/feedback_test.go \
            internal/dugble/worker/wire.go \
            migrations/026_extend_email_feedback_statuses.sql \
            migrations/atlas.sum
          test -n "$(git status --porcelain)"
          git commit -m "feat: unify messaging feedback processing"
          git push origin HEAD:feat/messaging-unified-feedback-processing
