name: Argus SQLC Sync

on:
  push:
    branches:
      - "fix/simplify-argus-verification"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/simplify-argus-verification
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Update dispatch snapshot
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("internal/delivery/argus/dispatch/processor.go")
          content = path.read_text()
          replacements = [
              (
                  '''\tServiceID    string          `json:"service_id"`\n\tChannel      string          `json:"channel"`\n\tRecipient    string          `json:"recipient"`\n\tStatus       string          `json:"status"`''',
                  '''\tChannel      string          `json:"channel"`\n\tRecipient    string          `json:"recipient"`\n\tCodeLength   int32           `json:"code_length"`\n\tTTLSeconds   int32           `json:"ttl_seconds"`\n\tMaxAttempts  int32           `json:"max_attempts"`\n\tMaxResends   int32           `json:"max_resends"`\n\tStatus       string          `json:"status"`''',
              ),
              (
                  '''\tvar id, serviceID uuid.UUID\n\tvar metadata []byte\n\terr := tx.QueryRow(ctx, `\n\t\tSELECT id, service_id, channel, recipient, status, locale, metadata,\n\t\t       attempt_count, resend_count, expires_at, approved_at, expired_at,\n\t\t       canceled_at, failed_at, created_at, updated_at\n\t\tFROM verifications\n\t\tWHERE id = $1 AND team_id = $2\n\t`, verificationID, teamID).Scan(\n\t\t&id, &serviceID, &snapshot.Channel, &snapshot.Recipient, &snapshot.Status,\n\t\t&snapshot.Locale, &metadata, &snapshot.AttemptCount, &snapshot.ResendCount,\n\t\t&snapshot.ExpiresAt, &snapshot.ApprovedAt, &snapshot.ExpiredAt,\n\t\t&snapshot.CanceledAt, &snapshot.FailedAt, &snapshot.CreatedAt, &snapshot.UpdatedAt,\n\t)''',
                  '''\tvar id uuid.UUID\n\tvar metadata []byte\n\terr := tx.QueryRow(ctx, `\n\t\tSELECT id, channel, recipient, code_length, ttl_seconds, max_attempts,\n\t\t       max_resends, status, locale, metadata, attempt_count, resend_count,\n\t\t       expires_at, approved_at, expired_at, canceled_at, failed_at,\n\t\t       created_at, updated_at\n\t\tFROM verifications\n\t\tWHERE id = $1 AND team_id = $2\n\t`, verificationID, teamID).Scan(\n\t\t&id, &snapshot.Channel, &snapshot.Recipient, &snapshot.CodeLength,\n\t\t&snapshot.TTLSeconds, &snapshot.MaxAttempts, &snapshot.MaxResends,\n\t\t&snapshot.Status, &snapshot.Locale, &metadata, &snapshot.AttemptCount,\n\t\t&snapshot.ResendCount, &snapshot.ExpiresAt, &snapshot.ApprovedAt,\n\t\t&snapshot.ExpiredAt, &snapshot.CanceledAt, &snapshot.FailedAt,\n\t\t&snapshot.CreatedAt, &snapshot.UpdatedAt,\n\t)''',
              ),
              (
                  '''\tsnapshot.ID = id.String()\n\tsnapshot.TeamID = teamID.String()\n\tsnapshot.ServiceID = serviceID.String()''',
                  '''\tsnapshot.ID = id.String()\n\tsnapshot.TeamID = teamID.String()''',
              ),
          ]
          for old, new in replacements:
              if old not in content:
                  raise SystemExit("expected dispatch snapshot text was not found")
              content = content.replace(old, new, 1)
          path.write_text(content)
          PY
      - name: Generate SQLC
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          rm -f internal/database/sqlc/verification_services.sql.go
          gofmt -w internal/database/sqlc internal/delivery/argus/dispatch/processor.go
      - name: Commit generated files
        run: |
          rm -f .github/workflows/argus-sqlc-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/database/sqlc internal/delivery/argus/dispatch/processor.go .github/workflows/argus-sqlc-sync.yml
          git commit -m "regenerate Argus sqlc"
          git push origin HEAD:fix/simplify-argus-verification
