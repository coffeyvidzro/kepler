name: Temporary Broadcast Fanout Validate

on:
  push:
    branches:
      - feat/broadcast-fanout
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-broadcast-fanout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/broadcast-fanout
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Atlas
        uses: ariga/setup-atlas@v0

      - name: Apply fanout processing slice
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          service_path = Path("internal/modules/messagetemplate/service.go")
          service = service_path.read_text()
          start = service.index("func (s *Service) RenderVersionTx")
          end = service.index("func (s *Service) TestSend", start)
          render_method = '''func (s *Service) RenderVersionTx(ctx context.Context, tx pgx.Tx, teamID, templateID, versionID uuid.UUID, variables map[string]any) (PreviewResponse, error) {
          if s == nil || s.repository == nil {
              return PreviewResponse{}, apperrors.NewInternal("Message template repository is not configured", nil)
          }
          if tx == nil {
              return PreviewResponse{}, apperrors.NewInternal("Message template transaction is not configured", nil)
          }
          version, err := s.repository.GetVersionTx(ctx, tx, teamID, templateID, versionID)
          if errors.Is(err, ErrVersionNotFound) {
              return PreviewResponse{}, apperrors.NewNotFound("Pinned template version not found")
          }
          if err != nil {
              return PreviewResponse{}, apperrors.NewInternal("Unable to load pinned template version", err)
          }
          rendered, err := Render(version, variables)
          if err != nil {
              return PreviewResponse{}, apperrors.NewBadRequest("Pinned template version could not be rendered")
          }
          return rendered, nil
          }

          '''
          service_path.write_text(service[:start] + render_method + service[end:])

          Path("internal/delivery/broadcast/processor.go").write_text(r'''package broadcastexecution

import (
    "context"
    "errors"
    "fmt"
    "log/slog"
    "strings"
    "time"

    "github.com/google/uuid"
    "github.com/jackc/pgx/v5"

    broadcastmodule "github.com/coffeyvidzro/dugble/server/internal/modules/broadcast"
    emailmodule "github.com/coffeyvidzro/dugble/server/internal/modules/email"
    messagetemplate "github.com/coffeyvidzro/dugble/server/internal/modules/messagetemplate"
)

type repository interface {
    QueueNextDueScheduled(context.Context) (broadcastmodule.Broadcast, bool, error)
    MaterializeNextQueuedRecipients(context.Context) (broadcastmodule.MaterializationResult, bool, error)
}

type fanoutRepository interface {
    BeginFanoutTx(context.Context) (pgx.Tx, error)
    ClaimNextRecipientForFanoutTx(context.Context, pgx.Tx) (broadcastmodule.FanoutRecipient, bool, error)
    SetRecipientQueuedTx(context.Context, pgx.Tx, broadcastmodule.FanoutRecipient, uuid.UUID) error
    RetryRecipientFanoutTx(context.Context, pgx.Tx, broadcastmodule.FanoutRecipient, time.Time, string, string) error
    FailRecipientFanoutTx(context.Context, pgx.Tx, broadcastmodule.FanoutRecipient, string, string) error
    FinalizeBroadcastFanoutTx(context.Context, pgx.Tx, uuid.UUID, uuid.UUID) (broadcastmodule.Broadcast, error)
}

type templateRenderer interface {
    RenderVersionTx(context.Context, pgx.Tx, uuid.UUID, uuid.UUID, uuid.UUID, map[string]any) (messagetemplate.PreviewResponse, error)
}

type emailEnqueuer interface {
    EnqueueTx(context.Context, pgx.Tx, uuid.UUID, emailmodule.SendRequest) (emailmodule.QueuedMessage, error)
    ObserveCommitted(context.Context, emailmodule.QueuedMessage)
}

type clock interface {
    Now() time.Time
}

type systemClock struct{}

func (systemClock) Now() time.Time { return time.Now().UTC() }

type Processor struct {
    repository repository
    fanout     fanoutRepository
    templates  templateRenderer
    emails     emailEnqueuer
    clock      clock
    retry      RetryPolicy
}

func NewProcessor(repository repository, dependencies ...any) *Processor {
    processor := &Processor{
        repository: repository,
        clock:      systemClock{},
        retry:      DefaultRetryPolicy(),
    }
    if fanout, ok := repository.(fanoutRepository); ok {
        processor.fanout = fanout
    }
    for _, dependency := range dependencies {
        if renderer, ok := dependency.(templateRenderer); ok {
            processor.templates = renderer
        }
        if enqueuer, ok := dependency.(emailEnqueuer); ok {
            processor.emails = enqueuer
        }
        if value, ok := dependency.(clock); ok {
            processor.clock = value
        }
        if policy, ok := dependency.(RetryPolicy); ok {
            processor.retry = policy.normalized()
        }
    }
    return processor
}

func (p *Processor) ProcessBatch(ctx context.Context, batchSize int) error {
    if p == nil || p.repository == nil {
        return ErrProcessorNotConfigured
    }
    if batchSize <= 0 {
        batchSize = 100
    }
    if err := p.queueDueBroadcasts(ctx, batchSize); err != nil {
        return err
    }
    if err := p.materializeQueuedBroadcasts(ctx, batchSize); err != nil {
        return err
    }
    if !p.fanoutConfigured() {
        return nil
    }
    return p.fanoutRecipients(ctx, batchSize)
}

func (p *Processor) fanoutConfigured() bool {
    return p != nil && p.fanout != nil && p.templates != nil && p.emails != nil && p.clock != nil
}

func (p *Processor) queueDueBroadcasts(ctx context.Context, batchSize int) error {
    for processed := 0; processed < batchSize; processed++ {
        broadcast, claimed, err := p.repository.QueueNextDueScheduled(ctx)
        if err != nil {
            return err
        }
        if !claimed {
            return nil
        }
        slog.Info(
            "scheduled broadcast queued for execution",
            "broadcast_id", broadcast.ID,
            "team_id", broadcast.TeamID,
            "scheduled_at", broadcast.ScheduledAt,
        )
    }
    return nil
}

func (p *Processor) materializeQueuedBroadcasts(ctx context.Context, batchSize int) error {
    for processed := 0; processed < batchSize; processed++ {
        result, claimed, err := p.repository.MaterializeNextQueuedRecipients(ctx)
        if err != nil {
            return err
        }
        if !claimed {
            return nil
        }
        slog.Info(
            "broadcast recipients materialized",
            "broadcast_id", result.BroadcastID,
            "team_id", result.TeamID,
            "audience_count", result.AudienceCount,
            "eligible_count", result.EligibleCount,
            "excluded_count", result.ExcludedCount,
        )
    }
    return nil
}

func (p *Processor) fanoutRecipients(ctx context.Context, batchSize int) error {
    for processed := 0; processed < batchSize; processed++ {
        claimed, err := p.processNextRecipient(ctx)
        if err != nil {
            return err
        }
        if !claimed {
            return nil
        }
    }
    return nil
}

func (p *Processor) processNextRecipient(ctx context.Context) (bool, error) {
    tx, err := p.fanout.BeginFanoutTx(ctx)
    if err != nil {
        return false, err
    }
    defer func() { _ = tx.Rollback(ctx) }()

    recipient, claimed, err := p.fanout.ClaimNextRecipientForFanoutTx(ctx, tx)
    if err != nil || !claimed {
        return claimed, err
    }

    variables := resolveRecipientVariables(recipient)
    rendered, err := p.templates.RenderVersionTx(
        ctx,
        tx,
        recipient.TeamID,
        recipient.TemplateID,
        recipient.TemplateVersionID,
        variables,
    )
    if err != nil {
        return p.recordRecipientFailure(ctx, tx, recipient, classifyFanoutFailure(err))
    }

    savepoint, err := tx.Begin(ctx)
    if err != nil {
        return false, fmt.Errorf("begin email fanout savepoint: %w", err)
    }
    queued, err := p.emails.EnqueueTx(ctx, savepoint, recipient.TeamID, buildEmailRequest(recipient, rendered))
    if err != nil {
        if rollbackErr := savepoint.Rollback(ctx); rollbackErr != nil && !errors.Is(rollbackErr, pgx.ErrTxClosed) {
            return false, fmt.Errorf("rollback email fanout savepoint: %w", rollbackErr)
        }
        if errors.Is(err, context.Canceled) || errors.Is(err, context.DeadlineExceeded) {
            return false, err
        }
        return p.recordRecipientFailure(ctx, tx, recipient, classifyFanoutFailure(err))
    }
    if err := savepoint.Commit(ctx); err != nil {
        return false, fmt.Errorf("commit email fanout savepoint: %w", err)
    }

    messageID, err := uuid.Parse(queued.Message.ID)
    if err != nil {
        return false, fmt.Errorf("parse queued email message id: %w", err)
    }
    if err := p.fanout.SetRecipientQueuedTx(ctx, tx, recipient, messageID); err != nil {
        return false, err
    }
    broadcast, err := p.fanout.FinalizeBroadcastFanoutTx(ctx, tx, recipient.TeamID, recipient.BroadcastID)
    if err != nil {
        return false, err
    }
    if err := tx.Commit(ctx); err != nil {
        return false, fmt.Errorf("commit broadcast recipient fanout: %w", err)
    }
    p.emails.ObserveCommitted(ctx, queued)
    slog.Info(
        "broadcast recipient queued for email delivery",
        "broadcast_id", recipient.BroadcastID,
        "recipient_id", recipient.ID,
        "email_message_id", messageID,
        "broadcast_status", broadcast.Status,
    )
    return true, nil
}

func (p *Processor) recordRecipientFailure(ctx context.Context, tx pgx.Tx, recipient broadcastmodule.FanoutRecipient, failure fanoutFailure) (bool, error) {
    if errors.Is(failure.cause, context.Canceled) || errors.Is(failure.cause, context.DeadlineExceeded) {
        return false, failure.cause
    }

    attempt := recipient.AttemptCount + 1
    retryable := failure.retryable && attempt < p.retry.MaxAttempts
    if retryable {
        nextAttemptAt := p.clock.Now().Add(p.retry.delay(recipient.AttemptCount))
        if err := p.fanout.RetryRecipientFanoutTx(ctx, tx, recipient, nextAttemptAt, failure.code, failure.message); err != nil {
            return false, err
        }
    } else {
        if err := p.fanout.FailRecipientFanoutTx(ctx, tx, recipient, failure.code, failure.message); err != nil {
            return false, err
        }
    }

    broadcast, err := p.fanout.FinalizeBroadcastFanoutTx(ctx, tx, recipient.TeamID, recipient.BroadcastID)
    if err != nil {
        return false, err
    }
    if err := tx.Commit(ctx); err != nil {
        return false, fmt.Errorf("commit broadcast recipient failure: %w", err)
    }
    slog.Warn(
        "broadcast recipient fanout failed",
        "broadcast_id", recipient.BroadcastID,
        "recipient_id", recipient.ID,
        "attempt", attempt,
        "retryable", retryable,
        "error_code", failure.code,
        "broadcast_status", broadcast.Status,
    )
    return true, nil
}

func resolveRecipientVariables(recipient broadcastmodule.FanoutRecipient) map[string]any {
    properties, _ := recipient.ContactSnapshot["properties"].(map[string]any)
    variables := make(map[string]any, len(properties)+len(recipient.VariableBindings)+3)
    for key, value := range properties {
        variables[key] = value
    }
    variables["EMAIL"] = recipient.Email
    variables["FIRST_NAME"] = pointerString(recipient.FirstName)
    variables["LAST_NAME"] = pointerString(recipient.LastName)
    for key, value := range recipient.VariableBindings {
        variables[key] = value
    }
    return variables
}

func buildEmailRequest(recipient broadcastmodule.FanoutRecipient, rendered messagetemplate.PreviewResponse) emailmodule.SendRequest {
    request := emailmodule.SendRequest{
        Stream:  emailmodule.MessageTypeMarketing,
        To:      emailmodule.EmailAddressList{{Email: recipient.Email, Name: recipientName(recipient)}},
        Subject: rendered.Subject,
        HTML:    rendered.HTML,
    }
    if rendered.Text != nil {
        request.Text = *rendered.Text
    }
    if rendered.FromEmail != nil {
        request.From = &emailmodule.EmailAddress{Email: *rendered.FromEmail}
        if rendered.FromName != nil {
            request.From.Name = *rendered.FromName
        }
    }
    if rendered.ReplyTo != nil {
        request.ReplyTo = emailmodule.EmailAddressList{{Email: *rendered.ReplyTo}}
    }
    return request
}

func recipientName(recipient broadcastmodule.FanoutRecipient) string {
    return strings.TrimSpace(strings.TrimSpace(pointerString(recipient.FirstName)) + " " + strings.TrimSpace(pointerString(recipient.LastName)))
}

func pointerString(value *string) string {
    if value == nil {
        return ""
    }
    return *value
}
''')

          Path("internal/delivery/broadcast/retry.go").write_text(r'''package broadcastexecution

import (
    "strings"
    "time"

    apperrors "github.com/coffeyvidzro/dugble/server/pkg/errors"
)

const maxFanoutFailureMessageRunes = 255

type RetryPolicy struct {
    MaxAttempts int32
    BaseDelay   time.Duration
    MaxDelay    time.Duration
}

func DefaultRetryPolicy() RetryPolicy {
    return RetryPolicy{
        MaxAttempts: 8,
        BaseDelay:   time.Minute,
        MaxDelay:    30 * time.Minute,
    }
}

func (policy RetryPolicy) normalized() RetryPolicy {
    defaults := DefaultRetryPolicy()
    if policy.MaxAttempts <= 0 {
        policy.MaxAttempts = defaults.MaxAttempts
    }
    if policy.BaseDelay <= 0 {
        policy.BaseDelay = defaults.BaseDelay
    }
    if policy.MaxDelay < policy.BaseDelay {
        policy.MaxDelay = defaults.MaxDelay
    }
    return policy
}

func (policy RetryPolicy) delay(attemptCount int32) time.Duration {
    policy = policy.normalized()
    delay := policy.BaseDelay
    for attempt := int32(0); attempt < attemptCount; attempt++ {
        if delay >= policy.MaxDelay/2 {
            return policy.MaxDelay
        }
        delay *= 2
    }
    if delay > policy.MaxDelay {
        return policy.MaxDelay
    }
    return delay
}

type fanoutFailure struct {
    code      string
    message   string
    retryable bool
    cause     error
}

func classifyFanoutFailure(err error) fanoutFailure {
    code := apperrors.CodeOf(err)
    message := safeFailureMessage(apperrors.MessageOf(err))
    retryable := true
    switch code {
    case apperrors.CodeBadRequest,
        apperrors.CodeForbidden,
        apperrors.CodeNotFound,
        apperrors.CodePayloadTooLarge,
        apperrors.CodeUnprocessableEntity:
        retryable = false
    case apperrors.CodePaymentRequired,
        apperrors.CodeConflict,
        apperrors.CodeTooManyRequests,
        apperrors.CodeInternal,
        apperrors.CodeServiceUnavailable:
        retryable = true
    }
    return fanoutFailure{code: code, message: message, retryable: retryable, cause: err}
}

func safeFailureMessage(message string) string {
    message = strings.TrimSpace(message)
    if message == "" {
        message = "Recipient fanout failed"
    }
    runes := []rune(message)
    if len(runes) > maxFanoutFailureMessageRunes {
        message = string(runes[:maxFanoutFailureMessageRunes])
    }
    return message
}
''')

          Path("internal/delivery/broadcast/processor_test.go").write_text(r'''package broadcastexecution

import (
    "context"
    "errors"
    "testing"
    "time"

    "github.com/google/uuid"
    "github.com/jackc/pgx/v5"

    broadcastmodule "github.com/coffeyvidzro/dugble/server/internal/modules/broadcast"
    emailmodule "github.com/coffeyvidzro/dugble/server/internal/modules/email"
    messagetemplate "github.com/coffeyvidzro/dugble/server/internal/modules/messagetemplate"
    apperrors "github.com/coffeyvidzro/dugble/server/pkg/errors"
)

type processorTx struct {
    pgx.Tx
    committed bool
    rolledBack bool
    children []*processorTx
}

func (tx *processorTx) Begin(context.Context) (pgx.Tx, error) {
    child := &processorTx{}
    tx.children = append(tx.children, child)
    return child, nil
}

func (tx *processorTx) Commit(context.Context) error {
    tx.committed = true
    return nil
}

func (tx *processorTx) Rollback(context.Context) error {
    tx.rolledBack = true
    return nil
}

type processorRepository struct {
    recipients []broadcastmodule.FanoutRecipient
    transactions []*processorTx
    queuedMessageID *uuid.UUID
    retryAt *time.Time
    retryCode string
    failed bool
    finalized int
}

func (repository *processorRepository) QueueNextDueScheduled(context.Context) (broadcastmodule.Broadcast, bool, error) {
    return broadcastmodule.Broadcast{}, false, nil
}

func (repository *processorRepository) MaterializeNextQueuedRecipients(context.Context) (broadcastmodule.MaterializationResult, bool, error) {
    return broadcastmodule.MaterializationResult{}, false, nil
}

func (repository *processorRepository) BeginFanoutTx(context.Context) (pgx.Tx, error) {
    tx := &processorTx{}
    repository.transactions = append(repository.transactions, tx)
    return tx, nil
}

func (repository *processorRepository) ClaimNextRecipientForFanoutTx(context.Context, pgx.Tx) (broadcastmodule.FanoutRecipient, bool, error) {
    if len(repository.recipients) == 0 {
        return broadcastmodule.FanoutRecipient{}, false, nil
    }
    recipient := repository.recipients[0]
    repository.recipients = repository.recipients[1:]
    return recipient, true, nil
}

func (repository *processorRepository) SetRecipientQueuedTx(_ context.Context, _ pgx.Tx, _ broadcastmodule.FanoutRecipient, messageID uuid.UUID) error {
    repository.queuedMessageID = &messageID
    return nil
}

func (repository *processorRepository) RetryRecipientFanoutTx(_ context.Context, _ pgx.Tx, _ broadcastmodule.FanoutRecipient, next time.Time, code, _ string) error {
    repository.retryAt = &next
    repository.retryCode = code
    return nil
}

func (repository *processorRepository) FailRecipientFanoutTx(context.Context, pgx.Tx, broadcastmodule.FanoutRecipient, string, string) error {
    repository.failed = true
    return nil
}

func (repository *processorRepository) FinalizeBroadcastFanoutTx(context.Context, pgx.Tx, uuid.UUID, uuid.UUID) (broadcastmodule.Broadcast, error) {
    repository.finalized++
    return broadcastmodule.Broadcast{Status: broadcastmodule.StatusQueued}, nil
}

type processorRenderer struct {
    result messagetemplate.PreviewResponse
    err error
    variables map[string]any
}

func (renderer *processorRenderer) RenderVersionTx(_ context.Context, _ pgx.Tx, _, _, _ uuid.UUID, variables map[string]any) (messagetemplate.PreviewResponse, error) {
    renderer.variables = variables
    return renderer.result, renderer.err
}

type processorEmail struct {
    result emailmodule.QueuedMessage
    err error
    request emailmodule.SendRequest
    enqueueCalls int
    observeCalls int
}

func (email *processorEmail) EnqueueTx(_ context.Context, _ pgx.Tx, _ uuid.UUID, request emailmodule.SendRequest) (emailmodule.QueuedMessage, error) {
    email.enqueueCalls++
    email.request = request
    return email.result, email.err
}

func (email *processorEmail) ObserveCommitted(context.Context, emailmodule.QueuedMessage) {
    email.observeCalls++
}

type fixedClock struct{ value time.Time }

func (clock fixedClock) Now() time.Time { return clock.value }

func testRecipient() broadcastmodule.FanoutRecipient {
    firstName := "Ada"
    lastName := "Lovelace"
    return broadcastmodule.FanoutRecipient{
        ID: uuid.New(), TeamID: uuid.New(), BroadcastID: uuid.New(),
        Email: "ada@example.com", FirstName: &firstName, LastName: &lastName,
        ContactSnapshot: map[string]any{
            "properties": map[string]any{"FIRST_NAME": "property", "plan": "pro"},
        },
        TemplateID: uuid.New(), TemplateVersionID: uuid.New(),
        VariableBindings: map[string]any{"plan": "enterprise", "campaign": "august"},
    }
}

func TestResolveRecipientVariablesUsesDocumentedPrecedence(t *testing.T) {
    recipient := testRecipient()
    variables := resolveRecipientVariables(recipient)

    if variables["EMAIL"] != recipient.Email {
        t.Fatalf("EMAIL = %v, want %s", variables["EMAIL"], recipient.Email)
    }
    if variables["FIRST_NAME"] != "Ada" {
        t.Fatalf("FIRST_NAME = %v, want Ada", variables["FIRST_NAME"])
    }
    if variables["plan"] != "enterprise" {
        t.Fatalf("plan = %v, want enterprise", variables["plan"])
    }
    if variables["campaign"] != "august" {
        t.Fatalf("campaign = %v, want august", variables["campaign"])
    }
}

func TestRetryPolicyBackoffIsBounded(t *testing.T) {
    policy := RetryPolicy{MaxAttempts: 8, BaseDelay: time.Minute, MaxDelay: 5 * time.Minute}
    if delay := policy.delay(0); delay != time.Minute {
        t.Fatalf("first delay = %v, want 1m", delay)
    }
    if delay := policy.delay(4); delay != 5*time.Minute {
        t.Fatalf("bounded delay = %v, want 5m", delay)
    }
}

func TestClassifyFanoutFailure(t *testing.T) {
    if failure := classifyFanoutFailure(apperrors.NewBadRequest("invalid rendered message")); failure.retryable {
        t.Fatal("bad request should be terminal")
    }
    if failure := classifyFanoutFailure(apperrors.NewServiceUnavailable("pricing unavailable", errors.New("offline"))); !failure.retryable {
        t.Fatal("service unavailable should be retryable")
    }
}

func TestProcessorQueuesRenderedRecipient(t *testing.T) {
    recipient := testRecipient()
    messageID := uuid.New()
    repository := &processorRepository{recipients: []broadcastmodule.FanoutRecipient{recipient}}
    renderer := &processorRenderer{result: messagetemplate.PreviewResponse{
        Subject: "Hello Ada", HTML: "<p>Hello Ada</p>",
    }}
    email := &processorEmail{result: emailmodule.QueuedMessage{Message: emailmodule.Message{ID: messageID.String()}}}
    processor := NewProcessor(repository, renderer, email)

    if err := processor.ProcessBatch(context.Background(), 10); err != nil {
        t.Fatalf("ProcessBatch returned error: %v", err)
    }
    if repository.queuedMessageID == nil || *repository.queuedMessageID != messageID {
        t.Fatalf("queued message id = %v, want %s", repository.queuedMessageID, messageID)
    }
    if repository.finalized != 1 {
        t.Fatalf("finalized = %d, want 1", repository.finalized)
    }
    if email.observeCalls != 1 {
        t.Fatalf("observe calls = %d, want 1", email.observeCalls)
    }
    if email.request.Stream != emailmodule.MessageTypeMarketing {
        t.Fatalf("stream = %s, want marketing", email.request.Stream)
    }
    if len(repository.transactions) < 1 || !repository.transactions[0].committed {
        t.Fatal("recipient transaction was not committed")
    }
}

func TestProcessorRecordsTerminalRenderFailure(t *testing.T) {
    repository := &processorRepository{recipients: []broadcastmodule.FanoutRecipient{testRecipient()}}
    renderer := &processorRenderer{err: apperrors.NewBadRequest("cannot render")}
    email := &processorEmail{}
    processor := NewProcessor(repository, renderer, email)

    if err := processor.ProcessBatch(context.Background(), 10); err != nil {
        t.Fatalf("ProcessBatch returned error: %v", err)
    }
    if !repository.failed {
        t.Fatal("terminal render failure was not recorded")
    }
    if repository.retryAt != nil {
        t.Fatal("terminal render failure should not be retried")
    }
    if email.enqueueCalls != 0 {
        t.Fatalf("email enqueue calls = %d, want 0", email.enqueueCalls)
    }
}

func TestProcessorSchedulesRetryAfterTransientEmailFailure(t *testing.T) {
    now := time.Date(2026, time.August, 7, 12, 0, 0, 0, time.UTC)
    repository := &processorRepository{recipients: []broadcastmodule.FanoutRecipient{testRecipient()}}
    renderer := &processorRenderer{result: messagetemplate.PreviewResponse{Subject: "Hello", HTML: "<p>Hello</p>"}}
    email := &processorEmail{err: apperrors.NewServiceUnavailable("Email pricing is unavailable", errors.New("offline"))}
    processor := NewProcessor(repository, renderer, email, fixedClock{value: now})

    if err := processor.ProcessBatch(context.Background(), 10); err != nil {
        t.Fatalf("ProcessBatch returned error: %v", err)
    }
    if repository.retryAt == nil || !repository.retryAt.Equal(now.Add(time.Minute)) {
        t.Fatalf("retry at = %v, want %v", repository.retryAt, now.Add(time.Minute))
    }
    if repository.failed {
        t.Fatal("transient email failure should not be terminal")
    }
    if len(repository.transactions) == 0 || len(repository.transactions[0].children) == 0 || !repository.transactions[0].children[0].rolledBack {
        t.Fatal("email savepoint was not rolled back")
    }
}
''')
          PY

      - name: Generate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Hash migrations
        run: atlas migrate hash --dir file://migrations

      - name: Format Go
        run: gofmt -w internal/database/sqlc internal/modules/email internal/modules/messagetemplate internal/modules/broadcast internal/delivery/broadcast internal/dugble/worker

      - name: Test
        run: go test ./...

      - name: Commit validated changes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
