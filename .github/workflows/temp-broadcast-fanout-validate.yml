name: Temporary Broadcast Fanout Validate

on:
  push:
    branches:
      - feat/broadcast-fanout
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-broadcast-fanout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/broadcast-fanout
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Atlas
        uses: ariga/setup-atlas@v0

      - name: Generate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Hash migrations
        run: atlas migrate hash --dir file://migrations

      - name: Format Go
        run: gofmt -w internal/database/sqlc internal/modules/email internal/modules/broadcast internal/delivery/broadcast internal/dugble/worker

      - name: Test
        run: go test ./...

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A internal/database/sqlc migrations/atlas.sum
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Generate broadcast fanout SQLC bindings"
          git push origin HEAD:feat/broadcast-fanout
