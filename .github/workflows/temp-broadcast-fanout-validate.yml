name: Temporary Broadcast Fanout Validate

on:
  push:
    branches:
      - feat/broadcast-fanout
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-broadcast-fanout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/broadcast-fanout
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Atlas
        uses: ariga/setup-atlas@v0

      - name: Apply worker wiring and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "internal/dugble/worker/wire.go",
              '''\tbroadcastmodule "github.com/coffeyvidzro/dugble/server/internal/modules/broadcast"
          \tdomainmodule "github.com/coffeyvidzro/dugble/server/internal/modules/domain"
          \t"github.com/coffeyvidzro/dugble/server/internal/modules/emailtenant"
          ''',
              '''\tbroadcastmodule "github.com/coffeyvidzro/dugble/server/internal/modules/broadcast"
          \tdomainmodule "github.com/coffeyvidzro/dugble/server/internal/modules/domain"
          \temailmodule "github.com/coffeyvidzro/dugble/server/internal/modules/email"
          \t"github.com/coffeyvidzro/dugble/server/internal/modules/emailtenant"
          \tmessagetemplatemodule "github.com/coffeyvidzro/dugble/server/internal/modules/messagetemplate"
          '''
          )
          replace_once(
              "internal/dugble/worker/wire.go",
              '''\tplatformevent "github.com/coffeyvidzro/dugble/server/internal/platform/event"
          \t"github.com/coffeyvidzro/dugble/server/internal/platform/outbox"
          ''',
              '''\tplatformbilling "github.com/coffeyvidzro/dugble/server/internal/platform/billing"
          \tplatformevent "github.com/coffeyvidzro/dugble/server/internal/platform/event"
          \t"github.com/coffeyvidzro/dugble/server/internal/platform/outbox"
          '''
          )
          replace_once(
              "internal/dugble/worker/wire.go",
              '''\tlifecycleEmitter := webhookEmitter
          \tbroadcastExecutionRepository := broadcastmodule.NewRepositoryWithEventEmitter(
          \t\tdb,
          \t\tplatformevent.NewEmitter(platformwebhook.NewEventSink(webhookEmitter)),
          \t)
          \tbroadcastExecutionConsumer := broadcastexecution.NewConsumer(
          \t\tbroadcastexecution.NewProcessor(broadcastExecutionRepository),
          \t\tbroadcastexecution.Config{
          \t\t\tPollInterval: time.Second,
          \t\t\tBatchSize:    100,
          \t\t},
          \t)
          ''',
              '''\tlifecycleEmitter := webhookEmitter
          \tbroadcastBillingService := platformbilling.NewService(platformbilling.NewRepository(db))
          \tbroadcastEmailRepository := emailmodule.NewRepository(db)
          \tbroadcastEmailService := emailmodule.NewService(
          \t\tbroadcastEmailRepository,
          \t\temaildelivery.NewQueue(outboxRepository),
          \t\temailmodule.ServiceConfig{
          \t\t\tDefaultFromEmail: cfg.AWS.FromEmail,
          \t\t\tDefaultProvider:  domainmodule.DefaultProvider,
          \t\t\tDefaultRegion:    cfg.AWS.Region,
          \t\t},
          \t\tbroadcastBillingService,
          \t)
          \tbroadcastTemplateService := messagetemplatemodule.NewService(
          \t\tmessagetemplatemodule.NewRepository(db),
          \t\tbroadcastEmailService,
          \t)
          \tbroadcastExecutionRepository := broadcastmodule.NewRepositoryWithEventEmitter(
          \t\tdb,
          \t\tplatformevent.NewEmitter(platformwebhook.NewEventSink(webhookEmitter)),
          \t)
          \tbroadcastExecutionConsumer := broadcastexecution.NewConsumer(
          \t\tbroadcastexecution.NewProcessor(
          \t\t\tbroadcastExecutionRepository,
          \t\t\tbroadcastTemplateService,
          \t\t\tbroadcastEmailService,
          \t\t),
          \t\tbroadcastexecution.Config{
          \t\t\tPollInterval: time.Second,
          \t\t\tBatchSize:    100,
          \t\t},
          \t)
          '''
          )

          replace_once(
              "internal/integration/messaging/database_test.go",
              "if len(migrationPaths) != 24 {\n\t\tt.Fatalf(\"expected 24 migrations, found %d\", len(migrationPaths))\n\t}",
              "if len(migrationPaths) != 30 {\n\t\tt.Fatalf(\"expected 30 migrations, found %d\", len(migrationPaths))\n\t}"
          )

          integration = Path("internal/integration/messaging/broadcast_fanout_test.go")
          integration.write_text(r'''package messaging_test

import (
    "context"
    "testing"

    "github.com/google/uuid"
    "github.com/jackc/pgx/v5"

    broadcastexecution "github.com/coffeyvidzro/dugble/server/internal/delivery/broadcast"
    broadcastmodule "github.com/coffeyvidzro/dugble/server/internal/modules/broadcast"
    domainmodule "github.com/coffeyvidzro/dugble/server/internal/modules/domain"
    emailmodule "github.com/coffeyvidzro/dugble/server/internal/modules/email"
    messagetemplatemodule "github.com/coffeyvidzro/dugble/server/internal/modules/messagetemplate"
    platformbilling "github.com/coffeyvidzro/dugble/server/internal/platform/billing"
)

type broadcastFanoutQueue struct {
    enqueued int
}

func (queue *broadcastFanoutQueue) EnqueueEmailDeliveryTx(context.Context, pgx.Tx, uuid.UUID, uuid.UUID) error {
    queue.enqueued++
    return nil
}

type broadcastFanoutBilling struct {
    charged  int
    observed int
}

func (billing *broadcastFanoutBilling) ChargeEmail(context.Context, pgx.Tx, platformbilling.EmailChargeInput) (platformbilling.Charge, error) {
    billing.charged++
    return platformbilling.Charge{}, nil
}

func (billing *broadcastFanoutBilling) ObserveCommittedCharge(context.Context, platformbilling.CommittedCharge) {
    billing.observed++
}

func TestBroadcastFanoutPersistsEmailAndFinalizesBroadcast(t *testing.T) {
    pool := openFreshDatabase(t)
    fixture := seedMessagingFixture(t, pool)
    ctx := context.Background()

    segmentID := uuid.New()
    templateID := uuid.New()
    versionID := uuid.New()
    broadcastID := uuid.New()
    recipientID := uuid.New()
    domainAssetID := uuid.New()
    domainBindingID := uuid.New()
    domainGrantID := uuid.New()

    if _, err := pool.Exec(ctx, `
        INSERT INTO sender_assets (
            id, owner_type, team_id, channel, identity, normalized_identity,
            status, health_status
        ) VALUES ($1, 'team', $2, 'email', 'example.com', 'example.com', 'active', 'healthy')
    `, domainAssetID, fixture.TeamID); err != nil {
        t.Fatalf("seed broadcast sender domain asset: %v", err)
    }
    if _, err := pool.Exec(ctx, `
        INSERT INTO sender_provider_bindings (
            id, sender_asset_id, provider, provider_account, region,
            status, verified, provider_whitelisted, health_status, verified_at
        ) VALUES ($1, $2, 'ses', 'default', 'us-east-1', 'active', true, true, 'healthy', now())
    `, domainBindingID, domainAssetID); err != nil {
        t.Fatalf("seed broadcast sender domain binding: %v", err)
    }
    if _, err := pool.Exec(ctx, `
        INSERT INTO sender_asset_grants (
            id, team_id, sender_asset_id, channel, status, is_default
        ) VALUES ($1, $2, $3, 'email', 'active', false)
    `, domainGrantID, fixture.TeamID, domainAssetID); err != nil {
        t.Fatalf("seed broadcast sender domain grant: %v", err)
    }
    if _, err := pool.Exec(ctx, `
        INSERT INTO segments (id, team_id, name)
        VALUES ($1, $2, 'Broadcast Fanout Segment')
    `, segmentID, fixture.TeamID); err != nil {
        t.Fatalf("seed broadcast segment: %v", err)
    }
    if _, err := pool.Exec(ctx, `
        INSERT INTO message_templates (id, team_id, name, alias, next_version_number)
        VALUES ($1, $2, 'Broadcast Fanout Template', 'broadcast_fanout', 2)
    `, templateID, fixture.TeamID); err != nil {
        t.Fatalf("seed broadcast template: %v", err)
    }
    if _, err := pool.Exec(ctx, `
        INSERT INTO message_template_versions (
            id, team_id, template_id, version_number, from_email, from_name,
            subject, html_body, text_body, variables
        ) VALUES (
            $1, $2, $3, 1, 'sender@example.com', 'Dugble',
            'Hello {{{ plan }}}', '<p>Hello {{{ plan }}}</p>', 'Hello {{{ plan }}}',
            '[{"key":"plan","type":"string"}]'::jsonb
        )
    `, versionID, fixture.TeamID, templateID); err != nil {
        t.Fatalf("seed broadcast template version: %v", err)
    }
    if _, err := pool.Exec(ctx, `
        UPDATE message_templates
        SET current_version_id = $1, published_version_id = $1, published_at = now()
        WHERE id = $2 AND team_id = $3
    `, versionID, templateID, fixture.TeamID); err != nil {
        t.Fatalf("publish broadcast template version: %v", err)
    }
    if _, err := pool.Exec(ctx, `
        INSERT INTO broadcasts (
            id, team_id, name, status, segment_id, template_id, template_version_id,
            variable_bindings, queued_at, recipients_materialized_at,
            audience_count, eligible_count
        ) VALUES (
            $1, $2, 'Broadcast Fanout', 'queued', $3, $4, $5,
            '{"plan":"enterprise"}'::jsonb, now(), now(), 1, 1
        )
    `, broadcastID, fixture.TeamID, segmentID, templateID, versionID); err != nil {
        t.Fatalf("seed queued broadcast: %v", err)
    }
    if _, err := pool.Exec(ctx, `
        INSERT INTO broadcast_recipients (
            id, team_id, broadcast_id, email, normalized_email,
            first_name, last_name, contact_snapshot, status
        ) VALUES (
            $1, $2, $3, 'ada@example.com', 'ada@example.com',
            'Ada', 'Lovelace', '{"properties":{"plan":"pro"}}'::jsonb, 'pending'
        )
    `, recipientID, fixture.TeamID, broadcastID); err != nil {
        t.Fatalf("seed pending broadcast recipient: %v", err)
    }

    queue := &broadcastFanoutQueue{}
    billing := &broadcastFanoutBilling{}
    emailService := emailmodule.NewService(
        emailmodule.NewRepository(pool),
        queue,
        emailmodule.ServiceConfig{
            DefaultFromEmail: "sender@example.com",
            DefaultProvider:  domainmodule.DefaultProvider,
            DefaultRegion:    "us-east-1",
        },
        billing,
    )
    templateService := messagetemplatemodule.NewService(
        messagetemplatemodule.NewRepository(pool),
        emailService,
    )
    processor := broadcastexecution.NewProcessor(
        broadcastmodule.NewRepository(pool),
        templateService,
        emailService,
    )

    if err := processor.ProcessBatch(ctx, 1); err != nil {
        t.Fatalf("process broadcast fanout: %v", err)
    }

    var recipientStatus string
    var emailMessageID uuid.UUID
    var attemptCount int32
    if err := pool.QueryRow(ctx, `
        SELECT status, email_message_id, attempt_count
        FROM broadcast_recipients
        WHERE id = $1
    `, recipientID).Scan(&recipientStatus, &emailMessageID, &attemptCount); err != nil {
        t.Fatalf("load fanned-out recipient: %v", err)
    }
    if recipientStatus != "queued" {
        t.Fatalf("recipient status = %q, want queued", recipientStatus)
    }
    if attemptCount != 0 {
        t.Fatalf("recipient attempt_count = %d, want 0", attemptCount)
    }

    var subject, toEmail, messageType string
    if err := pool.QueryRow(ctx, `
        SELECT subject, to_email, message_type
        FROM email_messages
        WHERE id = $1 AND team_id = $2
    `, emailMessageID, fixture.TeamID).Scan(&subject, &toEmail, &messageType); err != nil {
        t.Fatalf("load generated broadcast email: %v", err)
    }
    if subject != "Hello enterprise" {
        t.Fatalf("email subject = %q, want %q", subject, "Hello enterprise")
    }
    if toEmail != "ada@example.com" {
        t.Fatalf("email to = %q, want ada@example.com", toEmail)
    }
    if messageType != emailmodule.MessageTypeMarketing {
        t.Fatalf("email message_type = %q, want marketing", messageType)
    }

    var broadcastStatus string
    var queuedCount, failedCount int64
    if err := pool.QueryRow(ctx, `
        SELECT status, queued_count, failed_count
        FROM broadcasts
        WHERE id = $1 AND team_id = $2
    `, broadcastID, fixture.TeamID).Scan(&broadcastStatus, &queuedCount, &failedCount); err != nil {
        t.Fatalf("load finalized broadcast: %v", err)
    }
    if broadcastStatus != broadcastmodule.StatusSent {
        t.Fatalf("broadcast status = %q, want sent", broadcastStatus)
    }
    if queuedCount != 1 || failedCount != 0 {
        t.Fatalf("broadcast counts queued=%d failed=%d, want queued=1 failed=0", queuedCount, failedCount)
    }
    if queue.enqueued != 1 {
        t.Fatalf("delivery enqueue calls = %d, want 1", queue.enqueued)
    }
    if billing.charged != 1 || billing.observed != 1 {
        t.Fatalf("billing charged=%d observed=%d, want 1 and 1", billing.charged, billing.observed)
    }
}
''')

          processor_tests = Path("internal/delivery/broadcast/processor_test.go")
          tests = processor_tests.read_text()
          exhausted = r'''
func TestProcessorFailsRecipientAfterRetryBudgetIsExhausted(t *testing.T) {
    recipient := testRecipient()
    recipient.AttemptCount = DefaultRetryPolicy().MaxAttempts - 1
    repository := &processorRepository{recipients: []broadcastmodule.FanoutRecipient{recipient}}
    renderer := &processorRenderer{result: messagetemplate.PreviewResponse{Subject: "Hello", HTML: "<p>Hello</p>"}}
    email := &processorEmail{err: apperrors.NewServiceUnavailable("Email pricing is unavailable", errors.New("offline"))}
    processor := NewProcessor(repository, renderer, email)

    if err := processor.ProcessBatch(context.Background(), 10); err != nil {
        t.Fatalf("ProcessBatch returned error: %v", err)
    }
    if !repository.failed {
        t.Fatal("recipient should fail after exhausting retry attempts")
    }
    if repository.retryAt != nil {
        t.Fatal("exhausted recipient should not schedule another retry")
    }
}
'''
          if "TestProcessorFailsRecipientAfterRetryBudgetIsExhausted" not in tests:
              processor_tests.write_text(tests + exhausted)
          PY

      - name: Generate SQLC
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Hash migrations
        run: atlas migrate hash --dir file://migrations

      - name: Format Go
        run: gofmt -w internal/database/sqlc internal/modules/email internal/modules/messagetemplate internal/modules/broadcast internal/delivery/broadcast internal/dugble/worker internal/integration/messaging

      - name: Test
        run: go test ./...

      - name: Commit validated changes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A internal/database/sqlc internal/modules/email internal/modules/messagetemplate internal/modules/broadcast internal/delivery/broadcast internal/dugble/worker internal/integration/messaging migrations/atlas.sum
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git commit -m "Wire broadcast fanout worker and add integration tests"
          git push origin HEAD:feat/broadcast-fanout
