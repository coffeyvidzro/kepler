name: Refresh migration checksum

on:
  push:
    branches:
      - feat/messaging-trust-delivery-attempts
    paths:
      - ".github/workflows/hash-migrations.yml"

permissions:
  contents: write

jobs:
  hash:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/messaging-trust-delivery-attempts

      - name: Refresh Atlas checksum
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${PWD}/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Commit checksum
        run: |
          if git diff --quiet -- migrations/atlas.sum; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/atlas.sum
          git commit -m "chore: refresh migration checksum"
          git push origin HEAD:feat/messaging-trust-delivery-attempts
