<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verification code</title>
  </head>
  <body style="margin:0;background:#f4f4f5;color:#18181b;font-family:Arial,Helvetica,sans-serif;">
    <span style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;">
      {{.PreviewText}}
    </span>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 20px;font-size:24px;line-height:32px;">Verification code</h1>
                <p style="margin:0 0 16px;font-size:16px;line-height:24px;">Use this code to complete verification:</p>
                <p style="margin:0 0 20px;font-size:34px;font-weight:700;letter-spacing:8px;line-height:44px;">{{.Code}}</p>
                <p style="margin:0 0 12px;font-size:16px;line-height:24px;">This code expires in {{.ExpiresIn}}.</p>
                <p style="margin:0 0 12px;font-size:16px;line-height:24px;">Do not share this code with anyone.</p>
                <p style="margin:0;font-size:14px;line-height:22px;color:#52525b;">If you did not request this code, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
