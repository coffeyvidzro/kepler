name: dugble

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgres://${POSTGRES_USER:-dugble}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dugble}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  NATS_URL: nats://${NATS_USER:-dugble}:${NATS_PASSWORD:?set NATS_PASSWORD}@nats:4222,nats://${NATS_USER:-dugble}:${NATS_PASSWORD:?set NATS_PASSWORD}@nats-2:4222,nats://${NATS_USER:-dugble}:${NATS_PASSWORD:?set NATS_PASSWORD}@nats-3:4222
  FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
  BACKEND_URL: ${BACKEND_URL:?set BACKEND_URL}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:?set COOKIE_DOMAIN}
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS}
  VERIFY_HMAC_SECRET: ${VERIFY_HMAC_SECRET:?set VERIFY_HMAC_SECRET}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
  ARCJET_KEY: ${ARCJET_KEY:?set ARCJET_KEY}
  AWS_FROM_EMAIL: ${AWS_FROM_EMAIL:?set AWS_FROM_EMAIL}
  AWS_REGION: ${AWS_REGION:-eu-north-1}
  AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SNS_TOPIC_ARNS: ${AWS_SNS_TOPIC_ARNS:-}
  ARKESEL_BASE_URL: ${ARKESEL_BASE_URL:-https://sms.arkesel.com}
  ARKESEL_API_KEY: ${ARKESEL_API_KEY:-}
  MNOTIFY_BASE_URL: ${MNOTIFY_BASE_URL:-https://api.mnotify.com}
  MNOTIFY_API_KEY: ${MNOTIFY_API_KEY:-}
  NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: ${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED:-true}
  NEW_RELIC_LOG_ENABLED: ${NEW_RELIC_LOG_ENABLED:-true}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_ERROR_SAMPLE_RATE: ${SENTRY_ERROR_SAMPLE_RATE:-1}
  SENTRY_DEBUG: ${SENTRY_DEBUG:-false}

x-app-build: &app-build
  build:
    context: ../server
    dockerfile: Dockerfile

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: dugble-caddy
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      BACKOFFICE_DOMAIN: ${BACKOFFICE_DOMAIN:?set BACKOFFICE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dugble-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      server:
        condition: service_healthy
      backoffice:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: dugble-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dugble}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dugble}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dugble-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: arigaio/atlas:1.3.0-alpine
    container_name: dugble-migrate
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec /atlas migrate apply --dir file:///migrations --url "$$DATABASE_URL"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-dugble}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dugble}?sslmode=disable&search_path=public"
    volumes:
      - ../server/migrations:/migrations:ro
    networks:
      - dugble-network
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    container_name: dugble-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - dugble-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.14.3-alpine
    container_name: dugble-nats
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/nats/nats-server.conf"
      - "--user"
      - "${NATS_USER:-dugble}"
      - "--pass"
      - "${NATS_PASSWORD:?set NATS_PASSWORD}"
      - "--name"
      - "dugble-nats-1"
      - "--routes"
      - "nats://nats-2:6222,nats://nats-3:6222"
    expose:
      - "4222"
      - "6222"
      - "8222"
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data
    networks:
      - dugble-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nats-2:
    image: nats:2.14.3-alpine
    container_name: dugble-nats-2
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/nats/nats-server.conf"
      - "--user"
      - "${NATS_USER:-dugble}"
      - "--pass"
      - "${NATS_PASSWORD:?set NATS_PASSWORD}"
      - "--name"
      - "dugble-nats-2"
      - "--routes"
      - "nats://nats:6222,nats://nats-3:6222"
    expose:
      - "4222"
      - "6222"
      - "8222"
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data_2:/data
    networks:
      - dugble-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nats-3:
    image: nats:2.14.3-alpine
    container_name: dugble-nats-3
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/nats/nats-server.conf"
      - "--user"
      - "${NATS_USER:-dugble}"
      - "--pass"
      - "${NATS_PASSWORD:?set NATS_PASSWORD}"
      - "--name"
      - "dugble-nats-3"
      - "--routes"
      - "nats://nats:6222,nats://nats-2:6222"
    expose:
      - "4222"
      - "6222"
      - "8222"
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data_3:/data
    networks:
      - dugble-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    <<: *app-build
    container_name: dugble-server
    restart: unless-stopped
    command: ["/dugble/server"]
    environment:
      <<: *app-env
      HTTP_PORT: "8080"
    expose:
      - "8080"
    networks:
      - dugble-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy

  worker:
    <<: *app-build
    container_name: dugble-worker
    restart: unless-stopped
    command: ["/dugble/worker"]
    environment:
      <<: *app-env
    expose:
      - "8082"
    networks:
      - dugble-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8082/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy

  backoffice:
    <<: *app-build
    container_name: dugble-backoffice
    restart: unless-stopped
    command: ["/dugble/backoffice"]
    environment:
      <<: *app-env
      BACKOFFICE_HTTP_PORT: "8081"
      BACKOFFICE_ADMIN_EMAILS: ${BACKOFFICE_ADMIN_EMAILS:-}
    expose:
      - "8081"
    networks:
      - dugble-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8081/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

networks:
  dugble-network:
    name: dugble-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nats_data:
  nats_data_2:
  nats_data_3:
  caddy_data:
  caddy_config:
